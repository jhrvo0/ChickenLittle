; PlatformIO Project Configuration File para MotionPet
; https://docs.platformio.org/page/projectconf.html
;
; Conforme definido no ADR-01 (docs/architecture.md), este projeto utiliza
; o ESP-WROOM-32 com suporte nativo preemptivo a FreeRTOS SMP sob o framework Arduino.

[platformio]
default_envs = esp32dev
src_dir = .
include_dir = .

[env:esp32dev]
platform = espressif32
board = esp32dev
framework = arduino

; Velocidade do monitor serial USB sincronizada com o protocolo JSON Lines v1
monitor_speed = 115200
upload_speed = 921600

; Flags de compilação estrita e otimização
build_src_filter =
    +<common/>
    +<sensors/>
    +<communication/>
    +<gestures/>
    +<pet/>
    +<display/>
    +<main/>

build_flags =
    -std=gnu++17
    -O2
    -Wall
    -Wextra
    -D CORE_DEBUG_LEVEL=0
    -D MOTIONPET_SERIAL_BAUD=115200

; Bibliotecas externas opcionais para Ciclos futuros:
; bblanchon/ArduinoJson @ ^7.0.0
; marcoschwartz/LiquidCrystal @ ^1.0.7
lib_deps =
