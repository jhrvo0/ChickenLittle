# Somente TLS. Não ativa listener anônimo/1883 nem muda a stack loopback da Fase C.
listener 8883
protocol mqtt
allow_anonymous false
password_file /mosquitto/local/passwords
acl_file /mosquitto/config/motionlab.acl
cafile /mosquitto/local/ca.crt
certfile /mosquitto/local/server.crt
keyfile /mosquitto/local/server.key
tls_version tlsv1.2
require_certificate false
retain_available false
persistence true
persistence_location /mosquitto/data/
autosave_interval 30
max_inflight_messages 8
max_queued_messages 256
max_queued_bytes 524288
message_size_limit 4194304
memory_limit 33554432
log_dest stdout
connection_messages true
