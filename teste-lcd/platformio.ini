; Teste isolado do LCD 2004A. Nao depende do firmware do MotionPet.
;   pio run -d teste-lcd -t upload --upload-port COM3
;   .\.venv\Scripts\pio.exe device monitor -d teste-lcd -p COM3 -b 115200  (opcional)

[env:lcd]
