[build-system]
requires = ["setuptools>=68.0"]
build-backend = "setuptools.build_meta"

[project]
name = "motionpet"
version = "0.1.0"
description = "MotionPet — Sistema embarcado interativo com ESP32, TinyML, reconhecimento de gestos e pet virtual ASCII"
readme = "README.md"
requires-python = ">=3.11"
license = { text = "MIT" }
authors = [
    { name = "MotionPet Engineering" }
]
dependencies = [
    "pyserial>=3.5",
]

[project.optional-dependencies]
dev = [
    "pytest>=8.0",
]
serial = [
    "pyserial>=3.5",
]
ml = [
    "numpy>=1.26",
    "scikit-learn>=1.4",
]
mlops = [
    "numpy>=1.26",
    "scikit-learn>=1.4",
    "matplotlib>=3.10,<4",
    "mlflow-skinny==3.18.0",
    "pandas>=2.2,<4",
    "sqlalchemy>=2,<3",
    "alembic>=1.13,<2",
    "paho-mqtt==2.1.0",
    # Wheels ARM64: versões >=49 exigem compilação no ambiente Windows atual.
    "cryptography==46.0.3; sys_platform == 'win32' and platform_machine == 'ARM64'",
]

[project.scripts]
motionpet = "terminal.app:main"
motionpet-web = "terminal.web.server:main"

[tool.setuptools.packages.find]
include = ["terminal*", "simulator*", "ml*"]

[tool.setuptools.package-data]
"terminal.web" = ["static/*.html", "static/*.css", "static/*.js"]

[tool.pytest.ini_options]
testpaths = ["tests"]
pythonpath = ["."]
addopts = "-ra -q"
