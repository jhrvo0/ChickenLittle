<!doctype html><html lang="pt-BR"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>MotionPet — montagem em slides</title><style>
:root{--ink:#16202b;--mut:#5d6b78;--line:#d6dbe1;--acc:#0f5c9e;--pink:#e0007a;--bad:#b3261e;--ok:#157a35}
*{box-sizing:border-box}html,body{height:100%;margin:0}
body{display:grid;grid-template-rows:auto 1fr auto;background:#e9edf1;color:var(--ink);font:16px/1.45 "Segoe UI",system-ui,Arial,sans-serif;overflow:hidden}
.top{background:#16202b;color:#fff;padding:8px 14px;display:flex;gap:10px;align-items:center;flex-wrap:wrap}
.brand{font-weight:700;margin-right:6px;white-space:nowrap}
.chips{display:flex;gap:6px;flex-wrap:wrap}
.chip{border:1px solid #3d4b5a;background:#1f2d3b;color:#cfd8e2;border-radius:999px;padding:4px 12px;font-size:14px;cursor:pointer}
.chip.on{background:var(--acc);border-color:#5aa7e6;color:#fff;font-weight:600}.chip.prio{outline:2px solid var(--pink)}
.prog{height:5px;background:#2b3a49;position:relative}.prog i{position:absolute;left:0;top:0;bottom:0;background:var(--pink);transition:width .25s}
.stagewrap{display:grid;grid-template-rows:auto 1fr;min-height:0}
main{display:grid;grid-template-columns:minmax(0,1fr) 410px;gap:14px;padding:14px;min-height:0}
main.textonly{grid-template-columns:minmax(0,1fr)}main.textonly #figbox{display:none}
#figbox{position:relative;background:#fff;border:1px solid var(--line);border-radius:14px;overflow:hidden;box-shadow:0 2px 10px #0001;min-height:0}
#figbox svg{position:absolute;inset:0;width:100%;height:100%}
.figtools{position:absolute;right:10px;top:10px;display:flex;gap:6px;z-index:2}
.figtools button{border:1px solid var(--line);background:#ffffffdd;border-radius:8px;padding:5px 10px;font-size:13px;cursor:pointer}
.panel{background:#fff;border:1px solid var(--line);border-radius:14px;padding:16px 18px;overflow:auto;box-shadow:0 2px 10px #0001;min-height:0}
main.textonly .panel{max-width:1100px;margin:0 auto;width:100%}
.kicker{font-size:13px;letter-spacing:.06em;color:var(--acc);font-weight:700;text-transform:uppercase}
h1{font-size:26px;line-height:1.2;margin:4px 0 10px}
.hold{display:inline-block;background:var(--pink);color:#fff;border-radius:8px;padding:3px 10px;font-weight:700;font-size:13px;margin:0 0 10px}
.sec{font-size:12.5px;letter-spacing:.08em;color:var(--mut);font-weight:700;margin:14px 0 6px;text-transform:uppercase}
.card{border:1px solid var(--line);border-left:6px solid var(--acc);border-radius:10px;padding:8px 10px;margin:0 0 8px;background:#fbfcfd}
.card .t{font-weight:700}.card .m{color:var(--mut);font-size:14px}
.hole{display:inline-block;background:#fff;border:2px solid #16202b;border-radius:7px;padding:0 7px;font-weight:800;font-family:Consolas,monospace;font-size:15px;margin:0 2px}
.swatch{display:inline-block;width:16px;height:16px;border-radius:50%;border:2px solid #222;vertical-align:-3px;margin-right:6px}
.how{font-size:17px}
.warn{background:#fdecea;border:1px solid #f1b1ab;color:var(--bad);border-radius:10px;padding:8px 10px;margin:10px 0;font-weight:600}
ul.checks{margin:6px 0;padding-left:0;list-style:none}ul.checks li{margin:4px 0;display:flex;gap:8px;align-items:flex-start}
ul.checks li:before{content:"☐";font-size:18px;line-height:1.1}
pre{background:#101820;color:#e6edf3;border-radius:8px;padding:8px 70px 8px 10px;margin:6px 0;white-space:pre-wrap;word-break:break-all;font-size:13.5px;position:relative}
pre button{position:absolute;right:6px;top:6px;border:0;border-radius:6px;background:#2b3a49;color:#fff;font-size:12px;padding:3px 8px;cursor:pointer}
table.p{border-collapse:collapse;width:100%;font-size:14px}table.p td,table.p th{border:1px solid var(--line);padding:3px 6px;text-align:left}
.pill{display:inline-block;border-radius:999px;padding:1px 10px;font-size:12.5px;border:1px solid #e0a800;background:#fff7dd;color:#7a5200}
.big{font-size:19px}.cols2{columns:2;column-gap:28px}.cols2 li{break-inside:avoid}
.nav{background:#16202b;color:#fff;display:flex;align-items:center;gap:10px;padding:8px 14px}
.nav button{border:0;border-radius:10px;background:var(--acc);color:#fff;font-size:17px;font-weight:700;padding:9px 22px;cursor:pointer}
.nav button.sec2{background:#2b3a49}.nav button:disabled{opacity:.35;cursor:default}
.nav .cnt{margin-left:auto;color:#aebbc8}.nav .hint{color:#8fa0b1;font-size:13px}
.now{animation:glow 1.1s ease-in-out infinite alternate}
@keyframes glow{from{filter:drop-shadow(0 0 2px #ff2aa8)}to{filter:drop-shadow(0 0 11px #ff2aa8) drop-shadow(0 0 3px #ff2aa8)}}
.old{opacity:.8}.old .htag,.old .wlabel{display:none}.ghost{opacity:.28!important;filter:grayscale(.4)}
@media(max-width:980px){main{grid-template-columns:1fr;grid-template-rows:55% 45%}}

</svg></div><div class="panel" id="panel"></div></main><div class="nav"><button class="sec2" id="prev" onclick="go(k-1)">◀ Voltar</button><button id="next" onclick="go(k+1)">Avançar ▶</button><span class="hint">← → navegam · A ver tudo · F tela cheia</span><span class="cnt" id="cnt"></span></div><script>window.SLIDES=[{"kind": "text", "stage": "", "html": "<div class=\"kicker\">MotionPet · Ciclo 5 · firmware 0.5.0-cycle5<\/div><h1 style=\"font-size:40px\">Montagem em protoboard, passo a passo<\/h1><p class=\"big\">Cada slide mostra <b>o que adicionar<\/b> e <b>onde encaixar<\/b>. A protoboard vai crescendo na tela; o item novo pisca em rosa. Use as setas do teclado (← →) ou os botões.<\/p><div class=\"warn\">Status oficial: PENDING_PHYSICAL_VALIDATION — nada aqui foi medido numa bancada. Monte com a USB DESCONECTADA, meça com o multímetro e só então energize. A serigrafia da SUA placa sempre prevalece sobre o desenho.<\/div><div class=\"sec\">Confirme antes (bloqueiam o Estágio B)<\/div><ul class=\"checks\"><li><b>C01<\/b> — ESP32: contar os pinos (19+19=38 ou 15+15=30), medir a distancia entre as fileiras de pinos (22,86 mm = 9 furos; 25,4 mm = 10 furos) e conferir na serigrafia as posicoes de 5V, 3V3, GND, IO34, IO5.<\/li><li><b>C02<\/b> — Protoboards: 30 colunas e fileiras A-J em cada uma; a P2 encaixada na ponta da coluna 30 da P1. Trilhos de baixo: vermelho (+) e azul (-), continuos de ponta a ponta (se a linha tiver uma falha no meio, ligue as duas metades com um jumper).<\/li><li><b>C03<\/b> — Medir R1, R2 e R4 (1 kΩ ±5%: 0,95-1,05 kΩ) e R3 e R5 (300 Ω ±5%: 285-315 Ω) FORA do circuito. Lendo a partir da faixa dourada: 1 kΩ = dourado-vermelho-preto-marrom; 300 Ω = dourado-marrom-preto-laranja.<\/li><li><b>C04<\/b> — HC-SR04: ler a serigrafia e confirmar a ordem VCC-TRIG-ECHO-GND e que os pinos sao retos de 2,54 mm.<\/li><li><b>C09<\/b> — Jumpers: ~17 macho-macho (5 deles longos, 15-20 cm, para o LCD) e 7 femea-macho (4 para o HC-SR04 e 3 para o TCRT5000).<\/li><\/ul><p class=\"m\">Dica: tecla <b>A<\/b> mostra a protoboard inteira; <b>F<\/b> tela cheia. Estágio B (★) é a prioridade.<\/p>", "title": "MotionPet · montagem em protoboard"}, {"kind": "text", "stage": "", "html": "<div class=\"kicker\">Antes de começar<\/div><h1>O que você vai precisar<\/h1><table class=\"p\"><tr><th>Item<\/th><th>Qtd.<\/th><th>Observação<\/th><\/tr><tr><td>ESP32 DevKit (ESP-WROOM-32, USB-C)<\/td><td>1<\/td><td>Conte os pinos e meça a distância entre as fileiras (confirmação C01).<\/td><\/tr><tr><td>Meia-protoboard 30 colunas (A–J × 1–30) com trilhos + e −<\/td><td>2<\/td><td>Encaixadas pela ponta: P1 (ESP32) e P2 (LCD). Só os trilhos de BAIXO são usados: vermelho (+) = 5 V, azul (−) = GND.<\/td><\/tr><tr><td>Cabo USB de DADOS<\/td><td>1<\/td><td>Cabo só de carga não cria a porta COM.<\/td><\/tr><tr><td>HC-SR04<\/td><td>1<\/td><td>Estágio B, fora da placa.<\/td><\/tr><tr><td>Módulo TCRT5000 (LM393, 4 pinos)<\/td><td>1<\/td><td>Estágio C, fora da placa.<\/td><\/tr><tr><td>LCD 2004A (20×4, 16 pinos)<\/td><td>1<\/td><td>Estágio D, encaixado na P2.<\/td><\/tr><tr><td>Resistor 1 kΩ (dourado, vermelho, preto, marrom — lendo da faixa dourada)<\/td><td>3<\/td><td>R1 e R2 do divisor; R4 do contraste do LCD.<\/td><\/tr><tr><td>Resistor 300 Ω (dourado, marrom, preto, laranja — lendo da faixa dourada)<\/td><td>2<\/td><td>R3 do divisor; R5 do backlight do LCD.<\/td><\/tr><tr><td>Jumpers macho–macho<\/td><td>~17<\/td><td>Os 6 sinais do LCD (W12–W17) e o W3 são os longos (15–20 cm); o resto é curto.<\/td><\/tr><tr><td>Jumpers fêmea–macho<\/td><td>7<\/td><td>4 para o HC-SR04 e 3 para o TCRT5000.<\/td><\/tr><tr><td>Multímetro<\/td><td>1<\/td><td>Resistência, continuidade e tensão DC.<\/td><\/tr><\/table>", "title": "O que você vai precisar"}, {"kind": "step", "stage": "A", "focus": [0.0, 316.2, 780.0, 487.5], "ghost": ["U1"], "html": "<div class=\"kicker\">Estágio A · ESP32 isolado · passo 1 de 3<\/div><h1>Confira a sua ESP32 antes de encaixar<\/h1><div class=\"sec\">Como<\/div><div class=\"how\">Conte os pinos de cada lado e meça a distância entre as duas fileiras. Leia na placa: 3V3, 5V, GND, IO34 e IO5.<\/div><ul class=\"checks\"><li>19 pinos de cada lado (38 no total)?<\/li><li>Fileiras a 22,86 mm (9 furos)?<\/li><li>Serigrafia 3V3, 5V, GND, IO34, IO5 presente?<\/li><\/ul><div class=\"warn\">⚠ Se forem 25,4 mm (10 furos) ou 30 pinos, PARE: este layout não serve (confirmação C01).<\/div>", "title": ""}, {"kind": "step", "stage": "A", "focus": [0.0, 316.2, 780.0, 487.5], "ghost": [], "html": "<div class=\"kicker\">Estágio A · ESP32 isolado · passo 2 de 3<\/div><h1>Encaixe a ESP32 atravessando o canal<\/h1><div class=\"sec\">Adicione agora<\/div><div class=\"card\"><div class=\"t\">ESP32 DevKit<\/div><div class=\"m\">Atravessando o canal central: pino 1 de cada lado na coluna <b>1<\/b>; USB-C para a <b>esquerda<\/b>. Fileira B = lado 3V3…5V; fileira I = lado GND…CLK. Só as fileiras <b>A<\/b> e <b>J<\/b> ficam livres.<\/div><\/div><div class=\"sec\">Como<\/div><div class=\"how\">Cabo USB DESCONECTADO. USB-C virada para a esquerda, saindo um pouco para fora da protoboard. O pino 3V3 vai no furo 1B e o GND (lado de cima) no furo 1I: pino 1 de cada lado na coluna 1. Empurre por igual dos dois lados.<\/div>", "title": ""}, {"kind": "step", "stage": "A", "focus": [0.0, 316.2, 780.0, 487.5], "ghost": [], "html": "<div class=\"kicker\">Estágio A · ESP32 isolado · passo 3 de 3<\/div><h1>Cheque curtos e ligue só a ESP32<\/h1><div class=\"sec\">Como<\/div><div class=\"how\">Multímetro: 5V↔GND e 3V3↔GND não podem ter curto. Depois conecte a USB e valide.<\/div><pre>python -m terminal.bench stage A --serial-port COMx<button data-copy=\"python -m terminal.bench stage A --serial-port COMx\">copiar<\/button><\/pre><pre>python -m terminal.diag --serial-port COMx<button data-copy=\"python -m terminal.diag --serial-port COMx\">copiar<\/button><\/pre>", "title": ""}, {"kind": "step", "stage": "B", "focus": [0.0, 316.2, 780.0, 487.5], "ghost": [], "html": "<div class=\"kicker\">Estágio B · HC-SR04 + divisor de ECHO · passo 1 de 10<\/div><h1>Desligue tudo<\/h1><div class=\"sec\">Como<\/div><div class=\"how\">Desconecte o cabo USB. O Estágio B inteiro é montado com a placa desenergizada.<\/div>", "title": ""}, {"kind": "step", "stage": "B", "focus": [0.0, 466.2, 780.0, 487.5], "ghost": [], "html": "<div class=\"kicker\">Estágio B · HC-SR04 + divisor de ECHO · passo 2 de 10<\/div><h1>5 V e GND nos trilhos de baixo<\/h1><div class=\"sec\">Adicione agora<\/div><div class=\"card\" style=\"border-left-color:#e0312f\"><div class=\"t\"><span class=\"swatch\" style=\"background:#e0312f\"><\/span>Fio W1 · vermelho<\/div><div class=\"m\">5V da ESP32 -&gt; trilho + (vermelho) de baixo<\/div><div>Ponta 1: <span class=\"hole\">19A<\/span> <span class=\"m\">coluna do pino 5V da ESP32<\/span><\/div><div>Ponta 2: <span class=\"hole\">P1 trilho + (vermelho, baixo)<\/span> <span class=\"m\">5 V · qualquer furo desse trilho serve (use o mais perto)<\/span><\/div><div class=\"m\" style=\"color:var(--bad)\">⚠ So o HC-SR04 e o LCD usam 5 V. NUNCA ligue o TCRT5000 no trilho +.<\/div><\/div><div class=\"card\" style=\"border-left-color:#2b2b2b\"><div class=\"t\"><span class=\"swatch\" style=\"background:#2b2b2b\"><\/span>Fio W2 · preto<\/div><div class=\"m\">GND da ESP32 -&gt; trilho - (azul) de baixo<\/div><div>Ponta 1: <span class=\"hole\">14A<\/span> <span class=\"m\">coluna do pino GND da ESP32<\/span><\/div><div>Ponta 2: <span class=\"hole\">P1 trilho - (azul, baixo)<\/span> <span class=\"m\">GND · qualquer furo desse trilho serve (use o mais perto)<\/span><\/div><\/div><div class=\"sec\">Como<\/div><div class=\"how\">Fio vermelho: 19A → trilho + (vermelho) de baixo. Fio preto: 14A → trilho − (azul) de baixo. Qualquer furo do trilho serve; use o mais perto.<\/div><div class=\"warn\">⚠ Os trilhos de baixo agora são 5 V (+) e GND (−). Nada de 3,3 V vai neles.<\/div>", "title": ""}, {"kind": "step", "stage": "B", "focus": [0.0, 466.2, 780.0, 487.5], "ghost": [], "html": "<div class=\"kicker\">Estágio B · HC-SR04 + divisor de ECHO · passo 3 de 10<\/div><h1>Meça R1, R2 e R3 fora do circuito<\/h1><div class=\"sec\">Meça agora<\/div><div class=\"card\" style=\"border-left-color:#8a7440\"><div class=\"t\">R1 · 1 kΩ <span class=\"m\">(R1 divisor (ECHO -&gt; no))<\/span><\/div><svg width=\"132\" height=\"30\" viewBox=\"0 0 132 30\" xmlns=\"http://www.w3.org/2000/svg\"><path d=\"M2,15 H26 M106,15 H130\" stroke=\"#9aa0a6\" stroke-width=\"3\" stroke-linecap=\"round\"/><rect x=\"24\" y=\"4\" width=\"84\" height=\"22\" rx=\"11\" fill=\"#d9c28e\" stroke=\"#8a7440\"/><rect x=\"44\" y=\"4\" width=\"7\" height=\"22\" fill=\"#7a4a21\" stroke=\"#0003\" stroke-width=\".6\"/><rect x=\"58\" y=\"4\" width=\"7\" height=\"22\" fill=\"#111\" stroke=\"#0003\" stroke-width=\".6\"/><rect x=\"72\" y=\"4\" width=\"7\" height=\"22\" fill=\"#d62d20\" stroke=\"#0003\" stroke-width=\".6\"/><rect x=\"92\" y=\"4\" width=\"7\" height=\"22\" fill=\"#d4af37\" stroke=\"#0003\" stroke-width=\".6\"/><\/svg><div class=\"m\">marrom–preto–vermelho–dourado<\/div><div class=\"m\">a partir do dourado: <b>dourado–vermelho–preto–marrom<\/b><\/div><div class=\"m\">Meça: <b>950 Ω a 1,05 kΩ<\/b><\/div><\/div><div class=\"card\" style=\"border-left-color:#8a7440\"><div class=\"t\">R2 · 1 kΩ <span class=\"m\">(R2 divisor (no -&gt; meio))<\/span><\/div><svg width=\"132\" height=\"30\" viewBox=\"0 0 132 30\" xmlns=\"http://www.w3.org/2000/svg\"><path d=\"M2,15 H26 M106,15 H130\" stroke=\"#9aa0a6\" stroke-width=\"3\" stroke-linecap=\"round\"/><rect x=\"24\" y=\"4\" width=\"84\" height=\"22\" rx=\"11\" fill=\"#d9c28e\" stroke=\"#8a7440\"/><rect x=\"44\" y=\"4\" width=\"7\" height=\"22\" fill=\"#7a4a21\" stroke=\"#0003\" stroke-width=\".6\"/><rect x=\"58\" y=\"4\" width=\"7\" height=\"22\" fill=\"#111\" stroke=\"#0003\" stroke-width=\".6\"/><rect x=\"72\" y=\"4\" width=\"7\" height=\"22\" fill=\"#d62d20\" stroke=\"#0003\" stroke-width=\".6\"/><rect x=\"92\" y=\"4\" width=\"7\" height=\"22\" fill=\"#d4af37\" stroke=\"#0003\" stroke-width=\".6\"/><\/svg><div class=\"m\">marrom–preto–vermelho–dourado<\/div><div class=\"m\">a partir do dourado: <b>dourado–vermelho–preto–marrom<\/b><\/div><div class=\"m\">Meça: <b>950 Ω a 1,05 kΩ<\/b><\/div><\/div><div class=\"card\" style=\"border-left-color:#8a7440\"><div class=\"t\">R3 · 300 Ω <span class=\"m\">(R3 divisor (meio -&gt; trilho -))<\/span><\/div><svg width=\"132\" height=\"30\" viewBox=\"0 0 132 30\" xmlns=\"http://www.w3.org/2000/svg\"><path d=\"M2,15 H26 M106,15 H130\" stroke=\"#9aa0a6\" stroke-width=\"3\" stroke-linecap=\"round\"/><rect x=\"24\" y=\"4\" width=\"84\" height=\"22\" rx=\"11\" fill=\"#d9c28e\" stroke=\"#8a7440\"/><rect x=\"44\" y=\"4\" width=\"7\" height=\"22\" fill=\"#f08a1c\" stroke=\"#0003\" stroke-width=\".6\"/><rect x=\"58\" y=\"4\" width=\"7\" height=\"22\" fill=\"#111\" stroke=\"#0003\" stroke-width=\".6\"/><rect x=\"72\" y=\"4\" width=\"7\" height=\"22\" fill=\"#7a4a21\" stroke=\"#0003\" stroke-width=\".6\"/><rect x=\"92\" y=\"4\" width=\"7\" height=\"22\" fill=\"#d4af37\" stroke=\"#0003\" stroke-width=\".6\"/><\/svg><div class=\"m\">laranja–preto–marrom–dourado<\/div><div class=\"m\">a partir do dourado: <b>dourado–marrom–preto–laranja<\/b><\/div><div class=\"m\">Meça: <b>285 Ω a 315 Ω<\/b><\/div><\/div><div class=\"sec\">Como<\/div><div class=\"how\">Multímetro em Ω, com os resistores soltos. R1 e R2: 1 kΩ (a partir da faixa dourada: dourado, vermelho, preto, marrom). R3: 300 Ω (dourado, marrom, preto, laranja).<\/div>", "title": ""}, {"kind": "step", "stage": "B", "focus": [170.0, 426.2, 780.0, 487.5], "ghost": [], "html": "<div class=\"kicker\">Estágio B · HC-SR04 + divisor de ECHO · passo 4 de 10<\/div><h1>Instale o divisor (R1, R2, R3)<\/h1><div class=\"sec\">Adicione agora<\/div><div class=\"card\" style=\"border-left-color:#8a7440\"><div class=\"t\">R1 · 1 kΩ <span class=\"m\">(R1 divisor (ECHO -&gt; no))<\/span><\/div><svg width=\"132\" height=\"30\" viewBox=\"0 0 132 30\" xmlns=\"http://www.w3.org/2000/svg\"><path d=\"M2,15 H26 M106,15 H130\" stroke=\"#9aa0a6\" stroke-width=\"3\" stroke-linecap=\"round\"/><rect x=\"24\" y=\"4\" width=\"84\" height=\"22\" rx=\"11\" fill=\"#d9c28e\" stroke=\"#8a7440\"/><rect x=\"44\" y=\"4\" width=\"7\" height=\"22\" fill=\"#7a4a21\" stroke=\"#0003\" stroke-width=\".6\"/><rect x=\"58\" y=\"4\" width=\"7\" height=\"22\" fill=\"#111\" stroke=\"#0003\" stroke-width=\".6\"/><rect x=\"72\" y=\"4\" width=\"7\" height=\"22\" fill=\"#d62d20\" stroke=\"#0003\" stroke-width=\".6\"/><rect x=\"92\" y=\"4\" width=\"7\" height=\"22\" fill=\"#d4af37\" stroke=\"#0003\" stroke-width=\".6\"/><\/svg><div class=\"m\">marrom–preto–vermelho–dourado<\/div><div class=\"m\">a partir do dourado: <b>dourado–vermelho–preto–marrom<\/b><\/div><div class=\"m\">Pernas nos furos <span class=\"hole\">22C<\/span> e <span class=\"hole\">26C<\/span><\/div><\/div><div class=\"card\" style=\"border-left-color:#8a7440\"><div class=\"t\">R2 · 1 kΩ <span class=\"m\">(R2 divisor (no -&gt; meio))<\/span><\/div><svg width=\"132\" height=\"30\" viewBox=\"0 0 132 30\" xmlns=\"http://www.w3.org/2000/svg\"><path d=\"M2,15 H26 M106,15 H130\" stroke=\"#9aa0a6\" stroke-width=\"3\" stroke-linecap=\"round\"/><rect x=\"24\" y=\"4\" width=\"84\" height=\"22\" rx=\"11\" fill=\"#d9c28e\" stroke=\"#8a7440\"/><rect x=\"44\" y=\"4\" width=\"7\" height=\"22\" fill=\"#7a4a21\" stroke=\"#0003\" stroke-width=\".6\"/><rect x=\"58\" y=\"4\" width=\"7\" height=\"22\" fill=\"#111\" stroke=\"#0003\" stroke-width=\".6\"/><rect x=\"72\" y=\"4\" width=\"7\" height=\"22\" fill=\"#d62d20\" stroke=\"#0003\" stroke-width=\".6\"/><rect x=\"92\" y=\"4\" width=\"7\" height=\"22\" fill=\"#d4af37\" stroke=\"#0003\" stroke-width=\".6\"/><\/svg><div class=\"m\">marrom–preto–vermelho–dourado<\/div><div class=\"m\">a partir do dourado: <b>dourado–vermelho–preto–marrom<\/b><\/div><div class=\"m\">Pernas nos furos <span class=\"hole\">26D<\/span> e <span class=\"hole\">29D<\/span><\/div><\/div><div class=\"card\" style=\"border-left-color:#8a7440\"><div class=\"t\">R3 · 300 Ω <span class=\"m\">(R3 divisor (meio -&gt; trilho -))<\/span><\/div><svg width=\"132\" height=\"30\" viewBox=\"0 0 132 30\" xmlns=\"http://www.w3.org/2000/svg\"><path d=\"M2,15 H26 M106,15 H130\" stroke=\"#9aa0a6\" stroke-width=\"3\" stroke-linecap=\"round\"/><rect x=\"24\" y=\"4\" width=\"84\" height=\"22\" rx=\"11\" fill=\"#d9c28e\" stroke=\"#8a7440\"/><rect x=\"44\" y=\"4\" width=\"7\" height=\"22\" fill=\"#f08a1c\" stroke=\"#0003\" stroke-width=\".6\"/><rect x=\"58\" y=\"4\" width=\"7\" height=\"22\" fill=\"#111\" stroke=\"#0003\" stroke-width=\".6\"/><rect x=\"72\" y=\"4\" width=\"7\" height=\"22\" fill=\"#7a4a21\" stroke=\"#0003\" stroke-width=\".6\"/><rect x=\"92\" y=\"4\" width=\"7\" height=\"22\" fill=\"#d4af37\" stroke=\"#0003\" stroke-width=\".6\"/><\/svg><div class=\"m\">laranja–preto–marrom–dourado<\/div><div class=\"m\">a partir do dourado: <b>dourado–marrom–preto–laranja<\/b><\/div><div class=\"m\">Pernas nos furos <span class=\"hole\">29A<\/span> e <span class=\"hole\">P1 trilho - (azul, baixo)<\/span><\/div><\/div><div class=\"sec\">Como<\/div><div class=\"how\">R1 (1 kΩ): 22C e 26C. R2 (1 kΩ): 26D e 29D. R3 (300 Ω): 29A e o trilho − (azul) logo abaixo. A coluna 26 é o NÓ do divisor.<\/div>", "title": ""}, {"kind": "step", "stage": "B", "focus": [254.2, 396.2, 780.0, 487.5], "ghost": [], "html": "<div class=\"kicker\">Estágio B · HC-SR04 + divisor de ECHO · passo 5 de 10<\/div><h1>PARE: ensaio do divisor<\/h1><div class=\"hold\">PONTO DE PARADA — não avance sem conferir<\/div><div class=\"sec\">Adicione agora<\/div><div class=\"card\" style=\"border-left-color:#9a9a9a\"><div class=\"t\"><span class=\"swatch\" style=\"background:#9a9a9a\"><\/span>jumper TEMPORÁRIO · cinza<\/div><div class=\"m\">jumper TEMPORARIO do ensaio: trilho + -&gt; entrada do divisor (nao faz parte do circuito final)<\/div><div>Ponta 1: <span class=\"hole\">P1 trilho + (vermelho, baixo)<\/span> <span class=\"m\">5 V · qualquer furo desse trilho serve (use o mais perto)<\/span><\/div><div>Ponta 2: <span class=\"hole\">22B<\/span> <span class=\"m\">coluna da perna de R1<\/span><\/div><\/div><div class=\"sec\">Como<\/div><div class=\"how\">Sem o sensor e sem o fio verde. O jumper temporário (tracejado) leva 5 V do trilho + ao furo 22B. Conecte a USB e meça entre o furo 26A (ponteira vermelha) e o trilho − (ponteira preta): esperado ≈ 2,8 V (aceitável 2,5 a 3,2 V).<\/div><div class=\"warn\">⚠ Mais de 3,30 V: desconecte a USB AGORA (provável R3 no trilho errado) e refaça o divisor. Menos de 2,5 V: confira R2, R3 e o jumper temporário.<\/div>", "title": ""}, {"kind": "step", "stage": "B", "focus": [170.0, 426.2, 780.0, 487.5], "ghost": [], "html": "<div class=\"kicker\">Estágio B · HC-SR04 + divisor de ECHO · passo 6 de 10<\/div><h1>Registre a medição e tire o jumper<\/h1><div class=\"sec\">Como<\/div><div class=\"how\">Desconecte a USB e retire o jumper temporário.<\/div><pre>python -m terminal.bench divider --r1 1000 --r2 1300 --measured-v &lt;valor medido&gt;<button data-copy=\"python -m terminal.bench divider --r1 1000 --r2 1300 --measured-v &lt;valor medido&gt;\">copiar<\/button><\/pre>", "title": ""}, {"kind": "step", "stage": "B", "focus": [0.0, 430.0, 970.8, 606.7], "ghost": [], "html": "<div class=\"kicker\">Estágio B · HC-SR04 + divisor de ECHO · passo 7 de 10<\/div><h1>Ligue o HC-SR04 (4 jumpers fêmea–macho)<\/h1><div class=\"sec\">Adicione agora<\/div><div class=\"card\"><div class=\"t\">M1 · HC-SR04<\/div><div class=\"m\">Fora da protoboard: um jumper <b>fêmea–macho<\/b> por pino (fêmea no pino do módulo, macho no furo). Num trilho, qualquer furo serve.<\/div><table class=\"p\"><tr><th>Pino<\/th><th>Fio<\/th><th>Vai em<\/th><\/tr><tr><td><b>VCC<\/b><\/td><td><span class=\"swatch\" style=\"background:#e0312f\"><\/span>vermelho<\/td><td><span class=\"hole\">P1 trilho + (vermelho, baixo)<\/span><\/td><\/tr><tr><td><b>TRIG<\/b><\/td><td><span class=\"swatch\" style=\"background:#f2c30f\"><\/span>amarelo<\/td><td><span class=\"hole\">10J<\/span><\/td><\/tr><tr><td><b>ECHO<\/b><\/td><td><span class=\"swatch\" style=\"background:#f08a1c\"><\/span>laranja<\/td><td><span class=\"hole\">22E<\/span><\/td><\/tr><tr><td><b>GND<\/b><\/td><td><span class=\"swatch\" style=\"background:#2b2b2b\"><\/span>preto<\/td><td><span class=\"hole\">P1 trilho - (azul, baixo)<\/span><\/td><\/tr><\/table><div class=\"m\">Fica FORA da protoboard, ligado por 4 jumpers femea-macho (a ponta femea no pino do sensor). Assim voce aponta o sensor para onde quiser.<\/div><\/div><div class=\"sec\">Como<\/div><div class=\"how\">Ponta fêmea nos pinos do sensor (leia a serigrafia). VCC → trilho + de baixo; GND → trilho − de baixo; TRIG → 10J; ECHO → 22E. O sensor fica fora da placa, apontado para onde você quiser.<\/div><div class=\"warn\">⚠ VCC e GND trocados podem queimar o módulo. O ECHO vai no 22E (entrada do divisor), NUNCA direto na ESP32.<\/div>", "title": ""}, {"kind": "step", "stage": "B", "focus": [0.0, 430.0, 970.8, 606.7], "ghost": [], "html": "<div class=\"kicker\">Estágio B · HC-SR04 + divisor de ECHO · passo 8 de 10<\/div><h1>Inspecione antes de ligar<\/h1><div class=\"sec\">Como<\/div><div class=\"how\">Com a USB desconectada, confira no multímetro e a olho.<\/div><ul class=\"checks\"><li>Sem curto entre trilho + e trilho − (não apita)<\/li><li>A coluna 22 (ECHO) NÃO tem continuidade com nenhum pino da ESP32<\/li><li>Nada ligado em IO12, IO6…IO11 (SD0…CLK), TX0 ou RX0<\/li><\/ul>", "title": ""}, {"kind": "step", "stage": "B", "focus": [0.0, 399.2, 780.0, 487.5], "ghost": [], "html": "<div class=\"kicker\">Estágio B · HC-SR04 + divisor de ECHO · passo 9 de 10<\/div><h1>Último fio: NÓ → GPIO34<\/h1><div class=\"sec\">Adicione agora<\/div><div class=\"card\" style=\"border-left-color:#2fa84f\"><div class=\"t\"><span class=\"swatch\" style=\"background:#2fa84f\"><\/span>Fio W3 · verde<\/div><div class=\"m\">No do divisor -&gt; GPIO34<\/div><div>Ponta 1: <span class=\"hole\">26E<\/span> <span class=\"m\">coluna da perna de R1 e da perna de R2<\/span><\/div><div>Ponta 2: <span class=\"hole\">5A<\/span> <span class=\"m\">coluna do pino IO34 da ESP32<\/span><\/div><div class=\"m\" style=\"color:var(--bad)\">⚠ So instale depois do ensaio do passo 5.<\/div><\/div><div class=\"sec\">Como<\/div><div class=\"how\">Fio verde: 26E → 5A. É o único fio que leva o sinal do ECHO ao ESP32, e só entra depois do ensaio.<\/div><div class=\"warn\">⚠ Não instale este fio se o ensaio do passo 5 passou de 3,30 V.<\/div>", "title": ""}, {"kind": "step", "stage": "B", "focus": [0.0, 430.0, 970.8, 606.7], "ghost": [], "html": "<div class=\"kicker\">Estágio B · HC-SR04 + divisor de ECHO · passo 10 de 10<\/div><h1>Ligue e valide<\/h1><div class=\"sec\">Como<\/div><div class=\"how\">Conecte a USB e rode os comandos (com a mão a 25 cm do sensor).<\/div><pre>python -m terminal.bench stage B --serial-port COMx --r1 1000 --r2 1300 --measured-echo-v &lt;valor do passo 5&gt;<button data-copy=\"python -m terminal.bench stage B --serial-port COMx --r1 1000 --r2 1300 --measured-echo-v &lt;valor do passo 5&gt;\">copiar<\/button><\/pre><pre>python -m terminal.bench inspect --serial-port COMx --duration 5 --reference-cm 25<button data-copy=\"python -m terminal.bench inspect --serial-port COMx --duration 5 --reference-cm 25\">copiar<\/button><\/pre>", "title": ""}, {"kind": "step", "stage": "C", "focus": [0.0, 316.2, 780.0, 487.5], "ghost": [], "html": "<div class=\"kicker\">Estágio C · TCRT5000 · passo 1 de 3<\/div><h1>Desligue tudo<\/h1><div class=\"sec\">Como<\/div><div class=\"how\">Desconecte a USB antes de mexer.<\/div>", "title": ""}, {"kind": "step", "stage": "C", "focus": [0.0, 650.0, 787.2, 492.0], "ghost": [], "html": "<div class=\"kicker\">Estágio C · TCRT5000 · passo 2 de 3<\/div><h1>Ligue o TCRT5000 (3 jumpers fêmea–macho)<\/h1><div class=\"sec\">Adicione agora<\/div><div class=\"card\"><div class=\"t\">M2 · TCRT5000 (modulo LM393)<\/div><div class=\"m\">Fora da protoboard: um jumper <b>fêmea–macho<\/b> por pino (fêmea no pino do módulo, macho no furo). Num trilho, qualquer furo serve.<\/div><table class=\"p\"><tr><th>Pino<\/th><th>Fio<\/th><th>Vai em<\/th><\/tr><tr><td><b>VCC<\/b><\/td><td><span class=\"swatch\" style=\"background:#f08a1c\"><\/span>laranja<\/td><td><span class=\"hole\">1A<\/span><\/td><\/tr><tr><td><b>GND<\/b><\/td><td><span class=\"swatch\" style=\"background:#2b2b2b\"><\/span>preto<\/td><td><span class=\"hole\">P1 trilho - (azul, baixo)<\/span><\/td><\/tr><tr><td><b>DO<\/b><\/td><td><span class=\"swatch\" style=\"background:#2f6fe0\"><\/span>azul<\/td><td><span class=\"hole\">6A<\/span><\/td><\/tr><\/table><div class=\"m\">Sem fio: AO.<\/div><div class=\"m\">Fica FORA da protoboard, ligado por 3 jumpers femea-macho. O pino AO fica sem fio.<\/div><\/div><div class=\"sec\">Como<\/div><div class=\"how\">Ponta fêmea nos pinos do módulo (confira a serigrafia). VCC → 1A (3V3 da ESP32); GND → trilho − de baixo; DO → 6A (GPIO35). O AO fica sem fio.<\/div><div class=\"warn\">⚠ NUNCA ligue o VCC do TCRT5000 no trilho + (5 V). Ele vai no 1A (3,3 V).<\/div>", "title": ""}, {"kind": "step", "stage": "C", "focus": [0.0, 650.0, 787.2, 492.0], "ghost": [], "html": "<div class=\"kicker\">Estágio C · TCRT5000 · passo 3 de 3<\/div><h1>Ligue e valide<\/h1><div class=\"sec\">Como<\/div><div class=\"how\">Conecte a USB e rode o comando. Aproxime e afaste o dedo do TCRT5000.<\/div><pre>python -m terminal.bench stage C --serial-port COMx --component ir<button data-copy=\"python -m terminal.bench stage C --serial-port COMx --component ir\">copiar<\/button><\/pre>", "title": ""}, {"kind": "step", "stage": "D", "focus": [0.0, 316.2, 780.0, 487.5], "ghost": [], "html": "<div class=\"kicker\">Estágio D · LCD 2004A · passo 1 de 12<\/div><h1>Desligue tudo<\/h1><div class=\"sec\">Como<\/div><div class=\"how\">Desconecte a USB antes de mexer.<\/div>", "title": ""}, {"kind": "step", "stage": "D", "focus": [53.0, 165.1, 1263.8, 789.9], "ghost": [], "html": "<div class=\"kicker\">Estágio D · LCD 2004A · passo 2 de 12<\/div><h1>Encaixe a 2ª protoboard (P2)<\/h1><div class=\"sec\">Como<\/div><div class=\"how\">Encaixe a segunda meia-protoboard na ponta da primeira, do lado da coluna 30. Furos com &#x27;P2:&#x27; são dessa placa (ex.: P2:12F = coluna 12, fileira F da P2).<\/div>", "title": ""}, {"kind": "step", "stage": "D", "focus": [690.0, 10.1, 799.7, 499.8], "ghost": ["M3"], "html": "<div class=\"kicker\">Estágio D · LCD 2004A · passo 3 de 12<\/div><h1>Confira o LCD<\/h1><div class=\"sec\">Como<\/div><div class=\"how\">Olhe o módulo antes de encaixar.<\/div><ul class=\"checks\"><li>Conector de 16 pinos soldado?<\/li><li>Existe o resistor SMD R8/R9 do backlight? (se não, o R5 é obrigatório — e ele já está no desenho)<\/li><li>Pino 1 = VSS (veja a serigrafia)<\/li><\/ul>", "title": ""}, {"kind": "step", "stage": "D", "focus": [690.0, 10.1, 799.7, 499.8], "ghost": [], "html": "<div class=\"kicker\">Estágio D · LCD 2004A · passo 4 de 12<\/div><h1>Encaixe o LCD<\/h1><div class=\"sec\">Adicione agora<\/div><div class=\"card\"><div class=\"t\">M3 · LCD 2004A V1.1<\/div><div class=\"m\">Encaixe os pinos nestes furos:<\/div><table class=\"p\"><tr><th>Pino<\/th><th>Furo<\/th><\/tr><tr><td><b>VSS<\/b><\/td><td><span class=\"hole\">P2:12J<\/span><\/td><\/tr><tr><td><b>VDD<\/b><\/td><td><span class=\"hole\">P2:13J<\/span><\/td><\/tr><tr><td><b>V0<\/b><\/td><td><span class=\"hole\">P2:14J<\/span><\/td><\/tr><tr><td><b>RS<\/b><\/td><td><span class=\"hole\">P2:15J<\/span><\/td><\/tr><tr><td><b>RW<\/b><\/td><td><span class=\"hole\">P2:16J<\/span><\/td><\/tr><tr><td><b>E<\/b><\/td><td><span class=\"hole\">P2:17J<\/span><\/td><\/tr><tr><td><b>D4<\/b><\/td><td><span class=\"hole\">P2:22J<\/span><\/td><\/tr><tr><td><b>D5<\/b><\/td><td><span class=\"hole\">P2:23J<\/span><\/td><\/tr><tr><td><b>D6<\/b><\/td><td><span class=\"hole\">P2:24J<\/span><\/td><\/tr><tr><td><b>D7<\/b><\/td><td><span class=\"hole\">P2:25J<\/span><\/td><\/tr><tr><td><b>A<\/b><\/td><td><span class=\"hole\">P2:26J<\/span><\/td><\/tr><tr><td><b>K<\/b><\/td><td><span class=\"hole\">P2:27J<\/span><\/td><\/tr><\/table><div class=\"m\">D0–D3: encaixam mas ficam sem fio.<\/div><div class=\"m\">Encaixe pelo conector de 16 pinos na fileira J da P2 (pino 1 = VSS na coluna 12); o display fica para FORA da placa, do lado de cima.<\/div><\/div><div class=\"sec\">Como<\/div><div class=\"how\">Pino 1 (VSS) em P2:12J … pino 16 (K) em P2:27J. O display fica para fora da placa, do lado de cima.<\/div>", "title": ""}, {"kind": "step", "stage": "D", "focus": [272.3, 496.2, 780.0, 487.5], "ghost": [], "html": "<div class=\"kicker\">Estágio D · LCD 2004A · passo 5 de 12<\/div><h1>Pontes de 5 V e GND para a P2<\/h1><div class=\"sec\">Adicione agora<\/div><div class=\"card\" style=\"border-left-color:#e0312f\"><div class=\"t\"><span class=\"swatch\" style=\"background:#e0312f\"><\/span>Fio W4 · vermelho<\/div><div class=\"m\">Ponte 5 V: trilho + da P1 -&gt; trilho + da P2<\/div><div>Ponta 1: <span class=\"hole\">P1 trilho + (vermelho, baixo)<\/span> <span class=\"m\">5 V · qualquer furo desse trilho serve (use o mais perto)<\/span><\/div><div>Ponta 2: <span class=\"hole\">P2 trilho + (vermelho, baixo)<\/span> <span class=\"m\">5 V · qualquer furo desse trilho serve (use o mais perto)<\/span><\/div><\/div><div class=\"card\" style=\"border-left-color:#2b2b2b\"><div class=\"t\"><span class=\"swatch\" style=\"background:#2b2b2b\"><\/span>Fio W5 · preto<\/div><div class=\"m\">Ponte GND: trilho - da P1 -&gt; trilho - da P2<\/div><div>Ponta 1: <span class=\"hole\">P1 trilho - (azul, baixo)<\/span> <span class=\"m\">GND · qualquer furo desse trilho serve (use o mais perto)<\/span><\/div><div>Ponta 2: <span class=\"hole\">P2 trilho - (azul, baixo)<\/span> <span class=\"m\">GND · qualquer furo desse trilho serve (use o mais perto)<\/span><\/div><\/div><div class=\"sec\">Como<\/div><div class=\"how\">Os trilhos da P2 não estão ligados aos da P1. Vermelho: trilho + da P1 → trilho + da P2. Preto: trilho − da P1 → trilho − da P2 (ambos os de baixo).<\/div>", "title": ""}, {"kind": "step", "stage": "D", "focus": [697.2, 386.2, 780.0, 487.5], "ghost": [], "html": "<div class=\"kicker\">Estágio D · LCD 2004A · passo 6 de 12<\/div><h1>GND do LCD (inclusive o RW)<\/h1><div class=\"hold\">PONTO DE PARADA — não avance sem conferir<\/div><div class=\"sec\">Adicione agora<\/div><div class=\"card\" style=\"border-left-color:#2b2b2b\"><div class=\"t\"><span class=\"swatch\" style=\"background:#2b2b2b\"><\/span>Fio W6 · preto<\/div><div class=\"m\">VSS (pino 1) -&gt; trilho -<\/div><div>Ponta 1: <span class=\"hole\">P2:12F<\/span> <span class=\"m\">coluna (P2) do pino VSS do LCD<\/span><\/div><div>Ponta 2: <span class=\"hole\">P2 trilho - (azul, baixo)<\/span> <span class=\"m\">GND · qualquer furo desse trilho serve (use o mais perto)<\/span><\/div><\/div><div class=\"card\" style=\"border-left-color:#2b2b2b\"><div class=\"t\"><span class=\"swatch\" style=\"background:#2b2b2b\"><\/span>Fio W8 · preto<\/div><div class=\"m\">RW (pino 5) -&gt; trilho -<\/div><div>Ponta 1: <span class=\"hole\">P2:16F<\/span> <span class=\"m\">coluna (P2) do pino RW do LCD<\/span><\/div><div>Ponta 2: <span class=\"hole\">P2 trilho - (azul, baixo)<\/span> <span class=\"m\">GND · qualquer furo desse trilho serve (use o mais perto)<\/span><\/div><div class=\"m\" style=\"color:var(--bad)\">⚠ OBRIGATORIO: RW = 0 Ω para GND antes de ligar.<\/div><\/div><div class=\"card\" style=\"border-left-color:#2b2b2b\"><div class=\"t\"><span class=\"swatch\" style=\"background:#2b2b2b\"><\/span>Fio W9 · preto<\/div><div class=\"m\">K (pino 16) -&gt; trilho -<\/div><div>Ponta 1: <span class=\"hole\">P2:27F<\/span> <span class=\"m\">coluna (P2) do pino K do LCD<\/span><\/div><div>Ponta 2: <span class=\"hole\">P2 trilho - (azul, baixo)<\/span> <span class=\"m\">GND · qualquer furo desse trilho serve (use o mais perto)<\/span><\/div><\/div><div class=\"sec\">Como<\/div><div class=\"how\">Pretos, das colunas do LCD até o trilho − (azul) da P2: P2:12F (VSS), P2:16F (RW) e P2:27F (K). Meça RW↔GND: 0 Ω.<\/div><div class=\"warn\">⚠ O RW (pino 5) PRECISA estar no GND antes de ligar: protege os GPIOs de 5 V.<\/div>", "title": ""}, {"kind": "step", "stage": "D", "focus": [573.5, 396.2, 780.0, 487.5], "ghost": [], "html": "<div class=\"kicker\">Estágio D · LCD 2004A · passo 7 de 12<\/div><h1>5 V do LCD<\/h1><div class=\"sec\">Adicione agora<\/div><div class=\"card\" style=\"border-left-color:#e0312f\"><div class=\"t\"><span class=\"swatch\" style=\"background:#e0312f\"><\/span>Fio W7 · vermelho<\/div><div class=\"m\">VDD (pino 2) -&gt; trilho +<\/div><div>Ponta 1: <span class=\"hole\">P2:13F<\/span> <span class=\"m\">coluna (P2) do pino VDD do LCD<\/span><\/div><div>Ponta 2: <span class=\"hole\">P2 trilho + (vermelho, baixo)<\/span> <span class=\"m\">5 V · qualquer furo desse trilho serve (use o mais perto)<\/span><\/div><\/div><div class=\"sec\">Como<\/div><div class=\"how\">Vermelho: P2:13F (VDD) → trilho + (vermelho) da P2.<\/div>", "title": ""}, {"kind": "step", "stage": "D", "focus": [713.5, 406.8, 780.0, 487.5], "ghost": [], "html": "<div class=\"kicker\">Estágio D · LCD 2004A · passo 8 de 12<\/div><h1>Contraste e luz de fundo<\/h1><div class=\"sec\">Adicione agora<\/div><div class=\"card\" style=\"border-left-color:#8a7440\"><div class=\"t\">R4 · 1 kΩ <span class=\"m\">(R4 contraste (V0 -&gt; GND))<\/span><\/div><svg width=\"132\" height=\"30\" viewBox=\"0 0 132 30\" xmlns=\"http://www.w3.org/2000/svg\"><path d=\"M2,15 H26 M106,15 H130\" stroke=\"#9aa0a6\" stroke-width=\"3\" stroke-linecap=\"round\"/><rect x=\"24\" y=\"4\" width=\"84\" height=\"22\" rx=\"11\" fill=\"#d9c28e\" stroke=\"#8a7440\"/><rect x=\"44\" y=\"4\" width=\"7\" height=\"22\" fill=\"#7a4a21\" stroke=\"#0003\" stroke-width=\".6\"/><rect x=\"58\" y=\"4\" width=\"7\" height=\"22\" fill=\"#111\" stroke=\"#0003\" stroke-width=\".6\"/><rect x=\"72\" y=\"4\" width=\"7\" height=\"22\" fill=\"#d62d20\" stroke=\"#0003\" stroke-width=\".6\"/><rect x=\"92\" y=\"4\" width=\"7\" height=\"22\" fill=\"#d4af37\" stroke=\"#0003\" stroke-width=\".6\"/><\/svg><div class=\"m\">marrom–preto–vermelho–dourado<\/div><div class=\"m\">a partir do dourado: <b>dourado–vermelho–preto–marrom<\/b><\/div><div class=\"m\">Pernas nos furos <span class=\"hole\">P2:14F<\/span> e <span class=\"hole\">P2:14E<\/span><\/div><div class=\"m\">1 kΩ atravessando o canal na coluna 14 da P2: liga o V0 ao GND (via o fio W10). Se aparecerem só blocos pretos, troque por 1 kΩ + 1 kΩ; se a tela ficar vazia, use 300 Ω (C07).<\/div><\/div><div class=\"card\" style=\"border-left-color:#2b2b2b\"><div class=\"t\"><span class=\"swatch\" style=\"background:#2b2b2b\"><\/span>Fio W10 · preto<\/div><div class=\"m\">Ponta de baixo do R4 -&gt; trilho -<\/div><div>Ponta 1: <span class=\"hole\">P2:14A<\/span> <span class=\"m\">coluna (P2) da perna de R4<\/span><\/div><div>Ponta 2: <span class=\"hole\">P2 trilho - (azul, baixo)<\/span> <span class=\"m\">GND · qualquer furo desse trilho serve (use o mais perto)<\/span><\/div><\/div><div class=\"card\" style=\"border-left-color:#8a7440\"><div class=\"t\">R5 · 300 Ω <span class=\"m\">(R5 backlight (5V -&gt; A))<\/span><\/div><svg width=\"132\" height=\"30\" viewBox=\"0 0 132 30\" xmlns=\"http://www.w3.org/2000/svg\"><path d=\"M2,15 H26 M106,15 H130\" stroke=\"#9aa0a6\" stroke-width=\"3\" stroke-linecap=\"round\"/><rect x=\"24\" y=\"4\" width=\"84\" height=\"22\" rx=\"11\" fill=\"#d9c28e\" stroke=\"#8a7440\"/><rect x=\"44\" y=\"4\" width=\"7\" height=\"22\" fill=\"#f08a1c\" stroke=\"#0003\" stroke-width=\".6\"/><rect x=\"58\" y=\"4\" width=\"7\" height=\"22\" fill=\"#111\" stroke=\"#0003\" stroke-width=\".6\"/><rect x=\"72\" y=\"4\" width=\"7\" height=\"22\" fill=\"#7a4a21\" stroke=\"#0003\" stroke-width=\".6\"/><rect x=\"92\" y=\"4\" width=\"7\" height=\"22\" fill=\"#d4af37\" stroke=\"#0003\" stroke-width=\".6\"/><\/svg><div class=\"m\">laranja–preto–marrom–dourado<\/div><div class=\"m\">a partir do dourado: <b>dourado–marrom–preto–laranja<\/b><\/div><div class=\"m\">Pernas nos furos <span class=\"hole\">P2:26E<\/span> e <span class=\"hole\">P2:26F<\/span><\/div><div class=\"m\">300 Ω atravessando o canal na coluna 26 da P2: leva 5 V (via o fio W11) ao anodo do backlight. Seguro mesmo que a placa já tenha o resistor SMD (só deixa a luz mais fraca).<\/div><\/div><div class=\"card\" style=\"border-left-color:#e0312f\"><div class=\"t\"><span class=\"swatch\" style=\"background:#e0312f\"><\/span>Fio W11 · vermelho<\/div><div class=\"m\">Ponta de baixo do R5 -&gt; trilho +<\/div><div>Ponta 1: <span class=\"hole\">P2:26A<\/span> <span class=\"m\">coluna (P2) da perna de R5<\/span><\/div><div>Ponta 2: <span class=\"hole\">P2 trilho + (vermelho, baixo)<\/span> <span class=\"m\">5 V · qualquer furo desse trilho serve (use o mais perto)<\/span><\/div><\/div><div class=\"sec\">Como<\/div><div class=\"how\">R4 (1 kΩ) atravessando o canal: P2:14F e P2:14E; preto P2:14A → trilho −. R5 (300 Ω) atravessando o canal: P2:26F e P2:26E; vermelho P2:26A → trilho +.<\/div><div class=\"warn\">⚠ O contraste pode precisar de ajuste na bancada (C07).<\/div>", "title": ""}, {"kind": "step", "stage": "D", "focus": [155.0, 148.3, 939.8, 587.4], "ghost": [], "html": "<div class=\"kicker\">Estágio D · LCD 2004A · passo 9 de 12<\/div><h1>Sinais do display (1/3): RS e E<\/h1><div class=\"sec\">Adicione agora<\/div><div class=\"card\" style=\"border-left-color:#2f6fe0\"><div class=\"t\"><span class=\"swatch\" style=\"background:#2f6fe0\"><\/span>Fio W12 · azul<\/div><div class=\"m\">GPIO19 -&gt; RS (pino 4)<\/div><div>Ponta 1: <span class=\"hole\">8J<\/span> <span class=\"m\">coluna do pino IO19 da ESP32<\/span><\/div><div>Ponta 2: <span class=\"hole\">P2:15I<\/span> <span class=\"m\">coluna (P2) do pino RS do LCD<\/span><\/div><\/div><div class=\"card\" style=\"border-left-color:#2fa84f\"><div class=\"t\"><span class=\"swatch\" style=\"background:#2fa84f\"><\/span>Fio W13 · verde<\/div><div class=\"m\">GPIO18 -&gt; E (pino 6)<\/div><div>Ponta 1: <span class=\"hole\">9J<\/span> <span class=\"m\">coluna do pino IO18 da ESP32<\/span><\/div><div>Ponta 2: <span class=\"hole\">P2:17I<\/span> <span class=\"m\">coluna (P2) do pino E do LCD<\/span><\/div><\/div><div class=\"sec\">Como<\/div><div class=\"how\">8J → P2:15I (GPIO19 → RS) e 9J → P2:17I (GPIO18 → E). Os fios de sinal são longos: deixe-os folgados.<\/div>", "title": ""}, {"kind": "step", "stage": "D", "focus": [55.0, 98.6, 1159.8, 724.9], "ghost": [], "html": "<div class=\"kicker\">Estágio D · LCD 2004A · passo 10 de 12<\/div><h1>Sinais do display (2/3): D4 e D5<\/h1><div class=\"sec\">Adicione agora<\/div><div class=\"card\" style=\"border-left-color:#f4f4f4\"><div class=\"t\"><span class=\"swatch\" style=\"background:#f4f4f4\"><\/span>Fio W14 · branco<\/div><div class=\"m\">GPIO21 -&gt; D4 (pino 11)<\/div><div>Ponta 1: <span class=\"hole\">6J<\/span> <span class=\"m\">coluna do pino IO21 da ESP32<\/span><\/div><div>Ponta 2: <span class=\"hole\">P2:22I<\/span> <span class=\"m\">coluna (P2) do pino D4 do LCD<\/span><\/div><\/div><div class=\"card\" style=\"border-left-color:#8a5a2b\"><div class=\"t\"><span class=\"swatch\" style=\"background:#8a5a2b\"><\/span>Fio W15 · marrom<\/div><div class=\"m\">GPIO22 -&gt; D5 (pino 12)<\/div><div>Ponta 1: <span class=\"hole\">3J<\/span> <span class=\"m\">coluna do pino IO22 da ESP32<\/span><\/div><div>Ponta 2: <span class=\"hole\">P2:23I<\/span> <span class=\"m\">coluna (P2) do pino D5 do LCD<\/span><\/div><\/div><div class=\"sec\">Como<\/div><div class=\"how\">6J → P2:22I (GPIO21 → D4) e 3J → P2:23I (GPIO22 → D5).<\/div>", "title": ""}, {"kind": "step", "stage": "D", "focus": [35.0, 191.8, 1219.8, 762.4], "ghost": [], "html": "<div class=\"kicker\">Estágio D · LCD 2004A · passo 11 de 12<\/div><h1>Sinais do display (3/3): D6 e D7<\/h1><div class=\"sec\">Adicione agora<\/div><div class=\"card\" style=\"border-left-color:#f08a1c\"><div class=\"t\"><span class=\"swatch\" style=\"background:#f08a1c\"><\/span>Fio W16 · laranja<\/div><div class=\"m\">GPIO23 -&gt; D6 (pino 13)<\/div><div>Ponta 1: <span class=\"hole\">2J<\/span> <span class=\"m\">coluna do pino IO23 da ESP32<\/span><\/div><div>Ponta 2: <span class=\"hole\">P2:24I<\/span> <span class=\"m\">coluna (P2) do pino D6 do LCD<\/span><\/div><\/div><div class=\"card\" style=\"border-left-color:#8a47c9\"><div class=\"t\"><span class=\"swatch\" style=\"background:#8a47c9\"><\/span>Fio W17 · roxo<\/div><div class=\"m\">GPIO27 -&gt; D7 (pino 14)<\/div><div>Ponta 1: <span class=\"hole\">11A<\/span> <span class=\"m\">coluna do pino IO27 da ESP32<\/span><\/div><div>Ponta 2: <span class=\"hole\">P2:25G<\/span> <span class=\"m\">coluna (P2) do pino D7 do LCD<\/span><\/div><\/div><div class=\"sec\">Como<\/div><div class=\"how\">2J → P2:24I (GPIO23 → D6) e 11A → P2:25G (GPIO27 → D7). O D7 vem da fileira de BAIXO da ESP32 (11A).<\/div>", "title": ""}, {"kind": "step", "stage": "D", "focus": [690.0, 10.1, 799.7, 499.8], "ghost": [], "html": "<div class=\"kicker\">Estágio D · LCD 2004A · passo 12 de 12<\/div><h1>Ligue e valide<\/h1><div class=\"sec\">Como<\/div><div class=\"how\">Conecte a USB e rode o comando. Ajuste o contraste (R4) se o display mostrar só blocos ou nada.<\/div><pre>python -m terminal.bench stage D --serial-port COMx<button data-copy=\"python -m terminal.bench stage D --serial-port COMx\">copiar<\/button><\/pre>", "title": ""}, {"kind": "step", "stage": "E", "focus": [53.0, 165.1, 1263.8, 789.9], "ghost": [], "html": "<div class=\"kicker\">Estágio E · Montagem completa · passo 1 de 2<\/div><h1>Revisão final<\/h1><div class=\"hold\">PONTO DE PARADA — não avance sem conferir<\/div><div class=\"sec\">Como<\/div><div class=\"how\">Com a USB desconectada, repita as medições do guia de bancada.<\/div><ul class=\"checks\"><li>Sem curto entre trilho + e trilho − (&gt; 1 kΩ)<\/li><li>Sem curto 3V3↔GND (&gt; 500 Ω)<\/li><li>R1, R2, R4 = 0,95–1,05 kΩ; R3, R5 = 285–315 Ω (medidos soltos)<\/li><li>RW do LCD com 0 Ω até o GND<\/li><li>TCRT5000 só em 3V3 (1A)<\/li><li>Nada em IO6…IO12, TX0, RX0<\/li><\/ul>", "title": ""}, {"kind": "step", "stage": "E", "focus": [53.0, 165.1, 1263.8, 789.9], "ghost": [], "html": "<div class=\"kicker\">Estágio E · Montagem completa · passo 2 de 2<\/div><h1>Teste ponta a ponta<\/h1><div class=\"sec\">Como<\/div><div class=\"how\">Tudo montado: rode o teste completo.<\/div><pre>python -m terminal.bench e2e --serial-port COMx<button data-copy=\"python -m terminal.bench e2e --serial-port COMx\">copiar<\/button><\/pre>", "title": ""}, {"kind": "text", "stage": "", "html": "<div class=\"kicker\">Ajuda<\/div><h1>Se algo der errado<\/h1><ul class=\"cols2\"><li>ESP32 virada 180° (USB-C para o lado da coluna 19): os fios caem nos pinos da memória flash e ela reinicia sem parar (&#x27;invalid header&#x27; na serial). A USB-C fica na ponta da COLUNA 1.<\/li><li>ESP32 deslocada uma coluna: TODOS os pinos ficam errados. Confira: 3V3 na coluna 1 e 5V na coluna 19 (fileira de baixo).<\/li><li>Letras da protoboard invertidas (A no topo em vez de J): guie-se pelo NÚMERO da coluna; se as letras estiverem ao contrário, gire a protoboard.<\/li><li>HC-SR04 com VCC e GND trocados: pode queimar o módulo. Leia a serigrafia (VCC | TRIG | ECHO | GND) antes de encaixar.<\/li><li>ECHO ligado direto ao GPIO34 (sem divisor): proibido; entrega ~5 V a um pino de 3,3 V.<\/li><li>Ramos do divisor trocados (os 1,3 kΩ em cima, o 1 kΩ embaixo): o nó cai para 2,2 V (abaixo de 2,475 V) e a leitura falha (sem dano, mas sem distância).<\/li><li>TCRT5000 ligado no trilho + (5 V): ele só pode usar o 3V3 (furo 1A).<\/li><li>Trilhos trocados (vermelho/azul): confira a cor antes de encaixar; + é 5 V e − é GND.<\/li><li>Fio em IO12, IO6…IO11 (SD0…CLK) ou TX0/RX0: proibido (boot loop, falha de flash ou serial).<\/li><li>LCD com RW (pino 5) no ar: obrigatório ligar ao GND antes de energizar.<\/li><li>Cabo USB só de carga (sem dados): a porta COM nunca aparece.<\/li><li>Jumper &#x27;quase&#x27; encaixado: empurre até o fim e puxe de leve para testar.<\/li><\/ul>", "title": "Se algo der errado"}, {"kind": "text", "stage": "", "html": "<div class=\"kicker\">Ajuda<\/div><h1>A ESP32 não aparece como porta COM<\/h1><ol class=\"how\"><li>Troque o cabo por um cabo USB DE DADOS e teste outra porta USB do notebook.<\/li><li>Deixe SOMENTE a ESP32 na protoboard (Estágio A): sem sensores nem fios.<\/li><li>Windows: Gerenciador de Dispositivos &gt; Portas (COM e LPT). Sem porta? Instale o driver da ponte USB-serial da placa (CP210x ou CH340).<\/li><li>Rode <code>python -m terminal.bench ports<\/code> para listar as portas.<\/li><li>Não use a ESP32 se 5V/3V3 medirem fora de 4,75–5,25 V / 3,25–3,35 V.<\/li><li>Para gravar o firmware pode ser preciso segurar BOOT ao iniciar o upload.<\/li><\/ol>", "title": "A ESP32 não aparece como porta COM"}];window.FULLBOX=[0, 0, 1684.3, 1180.0];
const SL=window.SLIDES,svg=document.querySelector('#figbox svg'),main=document.querySelector('main');
let k=0,showAll=false,vb=null,raf=0;const FULL=window.FULLBOX;
const $=(s)=>document.querySelector(s);
function setVB(t,animate){if(!vb||!animate){vb=t.slice();svg.setAttribute('viewBox',vb.join(' '));return}
 const from=vb.slice(),t0=performance.now(),D=380;cancelAnimationFrame(raf);
 (function step(now){const p=Math.min(1,(now-t0)/D),e=p<.5?2*p*p:1-Math.pow(-2*p+2,2)/2;
  vb=from.map((v,i)=>v+(t[i]-v)*e);svg.setAttribute('viewBox',vb.join(' '));if(p<1)raf=requestAnimationFrame(step)})(t0)}
function apply(animate){const s=SL[k];
 main.classList.toggle('textonly',s.kind!=='step');
 document.querySelectorAll('[data-gstep]').forEach(e=>{const g=+e.dataset.gstep,u=e.dataset.until;
  const gh=(s.ghost||[]).includes(e.dataset.ref||e.dataset.id);
  const vis=(g<=k&&(u===undefined||k<=+u))||gh;e.style.display=vis?'':'none';
  e.classList.toggle('now',vis&&g===k&&!gh);e.classList.toggle('old',vis&&g<k&&!gh);e.classList.toggle('ghost',gh)});
 if(s.kind==='step')setVB(showAll?FULL:s.focus,animate);
 $('#panel').innerHTML=s.html;$('#panel').scrollTop=0;
 document.querySelectorAll('.chip').forEach(c=>c.classList.toggle('on',c.dataset.stage===s.stage));
 $('#bar').style.width=((k)/(SL.length-1)*100)+'%';$('#cnt').textContent=(k+1)+' / '+SL.length;
 $('#prev').disabled=k===0;$('#next').disabled=k===SL.length-1;
 try{localStorage.setItem('mp_slide',k)}catch(e){}history.replaceState(null,'','#'+(k+1))}
function go(i,animate=true){k=Math.max(0,Math.min(SL.length-1,i));apply(animate)}
document.addEventListener('keydown',e=>{if(e.target.tagName==='INPUT')return;
 if(['ArrowRight','PageDown',' ','Enter'].includes(e.key)){e.preventDefault();go(k+1)}
 else if(['ArrowLeft','PageUp','Backspace'].includes(e.key)){e.preventDefault();go(k-1)}
 else if(e.key==='Home')go(0);else if(e.key==='End')go(SL.length-1);
 else if(e.key==='a'||e.key==='A'){showAll=!showAll;apply(true)}
 else if(e.key==='f'||e.key==='F'){document.fullscreenElement?document.exitFullscreen():document.documentElement.requestFullscreen()}});
document.addEventListener('click',e=>{const b=e.target.closest('button[data-copy]');if(b){const t=b.dataset.copy;
 (navigator.clipboard?navigator.clipboard.writeText(t):Promise.reject()).catch(()=>{const ta=document.createElement('textarea');ta.value=t;document.body.appendChild(ta);ta.select();try{document.execCommand('copy')}catch(_){}ta.remove()});
 b.textContent='copiado';setTimeout(()=>b.textContent='copiar',1200)}});
let sx=null;document.addEventListener('touchstart',e=>{sx=e.touches[0].clientX},{passive:true});
document.addEventListener('touchend',e=>{if(sx===null)return;const d=e.changedTouches[0].clientX-sx;if(Math.abs(d)>70)go(k+(d<0?1:-1));sx=null});
let start=0;const h=parseInt((location.hash||'').slice(1));if(h>=1&&h<=SL.length)start=h-1;
else{try{start=Math.min(SL.length-1,parseInt(localStorage.getItem('mp_slide')||'0')||0)}catch(e){}}
go(start,false);
</script></body></html>
