<!doctype html><html lang="pt-BR"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>MotionPet — montagem em slides</title><style>
:root{--ink:#16202b;--mut:#5d6b78;--line:#d6dbe1;--acc:#0f5c9e;--pink:#e0007a;--bad:#b3261e;--ok:#157a35}
*{box-sizing:border-box}html,body{height:100%;margin:0}
body{display:grid;grid-template-rows:auto 1fr auto;background:#e9edf1;color:var(--ink);font:16px/1.45 "Segoe UI",system-ui,Arial,sans-serif;overflow:hidden}
.top{background:#16202b;color:#fff;padding:8px 14px;display:flex;gap:10px;align-items:center;flex-wrap:wrap}
.brand{font-weight:700;margin-right:6px;white-space:nowrap}
.chips{display:flex;gap:6px;flex-wrap:wrap}
.chip{border:1px solid #3d4b5a;background:#1f2d3b;color:#cfd8e2;border-radius:999px;padding:4px 12px;font-size:14px;cursor:pointer}
.chip.on{background:var(--acc);border-color:#5aa7e6;color:#fff;font-weight:600}.chip.prio{outline:2px solid var(--pink)}
.prog{height:5px;background:#2b3a49;position:relative}.prog i{position:absolute;left:0;top:0;bottom:0;background:var(--pink);transition:width .25s}
.stagewrap{display:grid;grid-template-rows:auto 1fr;min-height:0}
main{display:grid;grid-template-columns:minmax(0,1fr) 410px;gap:14px;padding:14px;min-height:0}
main.textonly{grid-template-columns:minmax(0,1fr)}main.textonly #figbox{display:none}
#figbox{position:relative;background:#fff;border:1px solid var(--line);border-radius:14px;overflow:hidden;box-shadow:0 2px 10px #0001;min-height:0}
#figbox svg{position:absolute;inset:0;width:100%;height:100%}
.figtools{position:absolute;right:10px;top:10px;display:flex;gap:6px;z-index:2}
.figtools button{border:1px solid var(--line);background:#ffffffdd;border-radius:8px;padding:5px 10px;font-size:13px;cursor:pointer}
.panel{background:#fff;border:1px solid var(--line);border-radius:14px;padding:16px 18px;overflow:auto;box-shadow:0 2px 10px #0001;min-height:0}
main.textonly .panel{max-width:1100px;margin:0 auto;width:100%}
.kicker{font-size:13px;letter-spacing:.06em;color:var(--acc);font-weight:700;text-transform:uppercase}
h1{font-size:26px;line-height:1.2;margin:4px 0 10px}
.hold{display:inline-block;background:var(--pink);color:#fff;border-radius:8px;padding:3px 10px;font-weight:700;font-size:13px;margin:0 0 10px}
.sec{font-size:12.5px;letter-spacing:.08em;color:var(--mut);font-weight:700;margin:14px 0 6px;text-transform:uppercase}
.card{border:1px solid var(--line);border-left:6px solid var(--acc);border-radius:10px;padding:8px 10px;margin:0 0 8px;background:#fbfcfd}
.card .t{font-weight:700}.card .m{color:var(--mut);font-size:14px}
.hole{display:inline-block;background:#fff;border:2px solid #16202b;border-radius:7px;padding:0 7px;font-weight:800;font-family:Consolas,monospace;font-size:15px;margin:0 2px}
.swatch{display:inline-block;width:16px;height:16px;border-radius:50%;border:2px solid #222;vertical-align:-3px;margin-right:6px}
.how{font-size:17px}
.warn{background:#fdecea;border:1px solid #f1b1ab;color:var(--bad);border-radius:10px;padding:8px 10px;margin:10px 0;font-weight:600}
ul.checks{margin:6px 0;padding-left:0;list-style:none}ul.checks li{margin:4px 0;display:flex;gap:8px;align-items:flex-start}
ul.checks li:before{content:"☐";font-size:18px;line-height:1.1}
pre{background:#101820;color:#e6edf3;border-radius:8px;padding:8px 10px;margin:6px 0;white-space:pre-wrap;word-break:break-all;font-size:13.5px;position:relative}
pre button{position:absolute;right:6px;top:6px;border:0;border-radius:6px;background:#2b3a49;color:#fff;font-size:12px;padding:3px 8px;cursor:pointer}
table.p{border-collapse:collapse;width:100%;font-size:14px}table.p td,table.p th{border:1px solid var(--line);padding:3px 6px;text-align:left}
.pill{display:inline-block;border-radius:999px;padding:1px 10px;font-size:12.5px;border:1px solid #e0a800;background:#fff7dd;color:#7a5200}
.big{font-size:19px}.cols2{columns:2;column-gap:28px}.cols2 li{break-inside:avoid}
.nav{background:#16202b;color:#fff;display:flex;align-items:center;gap:10px;padding:8px 14px}
.nav button{border:0;border-radius:10px;background:var(--acc);color:#fff;font-size:17px;font-weight:700;padding:9px 22px;cursor:pointer}
.nav button.sec2{background:#2b3a49}.nav button:disabled{opacity:.35;cursor:default}
.nav .cnt{margin-left:auto;color:#aebbc8}.nav .hint{color:#8fa0b1;font-size:13px}
.now{animation:glow 1.1s ease-in-out infinite alternate}
@keyframes glow{from{filter:drop-shadow(0 0 2px #ff2aa8)}to{filter:drop-shadow(0 0 11px #ff2aa8) drop-shadow(0 0 3px #ff2aa8)}}
.old{opacity:.8}.old .htag,.old .wlabel{display:none}.ghost{opacity:.28!important;filter:grayscale(.4)}
@media(max-width:980px){main{grid-template-columns:1fr;grid-template-rows:55% 45%}}

(★) é a prioridade.<\/p>", "title": "MotionPet · montagem em protoboard"}, {"kind": "text", "stage": "", "html": "<div class=\"kicker\">Antes de começar<\/div><h1>O que você vai precisar<\/h1><table class=\"p\"><tr><th>Item<\/th><th>Qtd.<\/th><th>Observação<\/th><\/tr><tr><td>ESP32 DevKit (ESP-WROOM-32, USB-C)<\/td><td>1<\/td><td>Conte os pinos e meça a distância entre as fileiras (confirmação C01).<\/td><\/tr><tr><td>Protoboard 830 pontos<\/td><td>1<\/td><td>Letras A–J e números 1–63 visíveis.<\/td><\/tr><tr><td>Cabo USB de DADOS<\/td><td>1<\/td><td>Cabo só de carga não cria a porta COM.<\/td><\/tr><tr><td>HC-SR04<\/td><td>1<\/td><td>Estágio B.<\/td><\/tr><tr><td>Resistor 2,2 kΩ (verm-verm-verm-dourado)<\/td><td>1<\/td><td>R1 do divisor.<\/td><\/tr><tr><td>Resistor 3,3 kΩ (lar-lar-verm-dourado)<\/td><td>1<\/td><td>R2 do divisor.<\/td><\/tr><tr><td>Módulo TCRT5000 (LM393, 4 pinos)<\/td><td>1<\/td><td>Estágio C.<\/td><\/tr><tr><td>Potenciômetro rotativo<\/td><td>1<\/td><td>Estágio C.<\/td><\/tr><tr><td>LCD 2004A V1.1 (16 pinos soldados)<\/td><td>1<\/td><td>Estágio D.<\/td><\/tr><tr><td>Resistores 1 kΩ e 150 Ω<\/td><td>1 de cada<\/td><td>Estágio D (contraste e backlight).<\/td><\/tr><tr><td>Jumpers macho-macho de ponta sólida<\/td><td>~25<\/td><td>Vários longos (W4, W9, W10, W18–W23).<\/td><\/tr><tr><td>Multímetro<\/td><td>1<\/td><td>Resistência, continuidade e tensão DC.<\/td><\/tr><\/table>", "title": "O que você vai precisar"}, {"kind": "step", "stage": "A", "focus": [0.0, 316.2, 780.0, 487.5], "ghost": ["U1"], "html": "<div class=\"kicker\">Estágio A · ESP32 isolado · passo 1 de 3<\/div><h1>Confira a sua ESP32 antes de encaixar<\/h1><div class=\"sec\">Como<\/div><div class=\"how\">Conte os pinos de cada lado e meça a distância entre as duas fileiras. Leia na placa: 3V3, 5V, GND, IO34 e IO5.<\/div><ul class=\"checks\"><li>19 pinos de cada lado (38 no total)?<\/li><li>Fileiras a 22,86 mm (9 furos)?<\/li><li>Serigrafia 3V3, 5V, GND, IO34, IO5 presente?<\/li><\/ul><div class=\"warn\">⚠ Se forem 25,4 mm (10 furos) ou 30 pinos, PARE: este layout não serve (confirmação C01).<\/div>", "title": ""}, {"kind": "step", "stage": "A", "focus": [0.0, 316.2, 780.0, 487.5], "ghost": [], "html": "<div class=\"kicker\">Estágio A · ESP32 isolado · passo 2 de 3<\/div><h1>Encaixe a ESP32 atravessando o canal<\/h1><div class=\"sec\">Adicione agora<\/div><div class=\"card\"><div class=\"t\">ESP32 DevKit<\/div><div class=\"m\">Atravessando o canal central: pino 1 de cada lado na coluna <b>4<\/b>; USB-C para a <b>esquerda<\/b>. Fileira B = lado 3V3…5V; fileira I = lado GND…CLK. Só as fileiras <b>A<\/b> e <b>J<\/b> ficam livres.<\/div><\/div><div class=\"sec\">Como<\/div><div class=\"how\">Cabo USB DESCONECTADO. USB-C virada para a esquerda. O pino 3V3 fica na coluna 4 (fileira B) e o GND, na coluna 4 (fileira I). Empurre por igual dos dois lados.<\/div>", "title": ""}, {"kind": "step", "stage": "A", "focus": [0.0, 316.2, 780.0, 487.5], "ghost": [], "html": "<div class=\"kicker\">Estágio A · ESP32 isolado · passo 3 de 3<\/div><h1>Cheque curtos e ligue só a ESP32<\/h1><div class=\"sec\">Como<\/div><div class=\"how\">Multímetro: 5V↔GND e 3V3↔GND não podem ter curto. Depois conecte a USB e valide.<\/div><pre>python -m terminal.bench stage A --serial-port COMx<button data-copy=\"python -m terminal.bench stage A --serial-port COMx\">copiar<\/button><\/pre><pre>python -m terminal.diag --serial-port COMx<button data-copy=\"python -m terminal.diag --serial-port COMx\">copiar<\/button><\/pre>", "title": ""}, {"kind": "step", "stage": "B", "focus": [0.0, 316.2, 780.0, 487.5], "ghost": [], "html": "<div class=\"kicker\">Estágio B · HC-SR04 + divisor de ECHO · passo 1 de 11<\/div><h1>Desligue tudo<\/h1><div class=\"sec\">Como<\/div><div class=\"how\">Desconecte o cabo USB. O Estágio B inteiro é montado com a placa desenergizada.<\/div>", "title": ""}, {"kind": "step", "stage": "B", "focus": [0.0, 316.2, 780.0, 487.5], "ghost": [], "html": "<div class=\"kicker\">Estágio B · HC-SR04 + divisor de ECHO · passo 2 de 11<\/div><h1>Meça R1 e R2 fora do circuito<\/h1><div class=\"sec\">Meça agora<\/div><div class=\"card\" style=\"border-left-color:#8a7440\"><div class=\"t\">R1 · 2,2 kΩ <span class=\"m\">(R1 divisor (ECHO -&gt; no))<\/span><\/div><svg width=\"132\" height=\"30\" viewBox=\"0 0 132 30\" xmlns=\"http://www.w3.org/2000/svg\"><path d=\"M2,15 H26 M106,15 H130\" stroke=\"#9aa0a6\" stroke-width=\"3\" stroke-linecap=\"round\"/><rect x=\"24\" y=\"4\" width=\"84\" height=\"22\" rx=\"11\" fill=\"#d9c28e\" stroke=\"#8a7440\"/><rect x=\"44\" y=\"4\" width=\"7\" height=\"22\" fill=\"#d62d20\" stroke=\"#0003\" stroke-width=\".6\"/><rect x=\"58\" y=\"4\" width=\"7\" height=\"22\" fill=\"#d62d20\" stroke=\"#0003\" stroke-width=\".6\"/><rect x=\"72\" y=\"4\" width=\"7\" height=\"22\" fill=\"#d62d20\" stroke=\"#0003\" stroke-width=\".6\"/><rect x=\"92\" y=\"4\" width=\"7\" height=\"22\" fill=\"#d4af37\" stroke=\"#0003\" stroke-width=\".6\"/><\/svg><div class=\"m\">vermelho–vermelho–vermelho–dourado<\/div><div class=\"m\">Meça: <b>2,09 kΩ a 2,31 kΩ<\/b><\/div><\/div><div class=\"card\" style=\"border-left-color:#8a7440\"><div class=\"t\">R2 · 3,3 kΩ <span class=\"m\">(R2 divisor (no -&gt; GND))<\/span><\/div><svg width=\"132\" height=\"30\" viewBox=\"0 0 132 30\" xmlns=\"http://www.w3.org/2000/svg\"><path d=\"M2,15 H26 M106,15 H130\" stroke=\"#9aa0a6\" stroke-width=\"3\" stroke-linecap=\"round\"/><rect x=\"24\" y=\"4\" width=\"84\" height=\"22\" rx=\"11\" fill=\"#d9c28e\" stroke=\"#8a7440\"/><rect x=\"44\" y=\"4\" width=\"7\" height=\"22\" fill=\"#f08a1c\" stroke=\"#0003\" stroke-width=\".6\"/><rect x=\"58\" y=\"4\" width=\"7\" height=\"22\" fill=\"#f08a1c\" stroke=\"#0003\" stroke-width=\".6\"/><rect x=\"72\" y=\"4\" width=\"7\" height=\"22\" fill=\"#d62d20\" stroke=\"#0003\" stroke-width=\".6\"/><rect x=\"92\" y=\"4\" width=\"7\" height=\"22\" fill=\"#d4af37\" stroke=\"#0003\" stroke-width=\".6\"/><\/svg><div class=\"m\">laranja–laranja–vermelho–dourado<\/div><div class=\"m\">Meça: <b>3,135 kΩ a 3,465 kΩ<\/b><\/div><\/div><div class=\"sec\">Como<\/div><div class=\"how\">Multímetro em Ω, com os resistores soltos. Fora da faixa? Troque o resistor.<\/div>", "title": ""}, {"kind": "step", "stage": "B", "focus": [340.0, 256.2, 780.0, 487.5], "ghost": [], "html": "<div class=\"kicker\">Estágio B · HC-SR04 + divisor de ECHO · passo 3 de 11<\/div><h1>Instale R1 e R2 (ainda sem o sensor)<\/h1><div class=\"sec\">Adicione agora<\/div><div class=\"card\" style=\"border-left-color:#8a7440\"><div class=\"t\">R1 · 2,2 kΩ <span class=\"m\">(R1 divisor (ECHO -&gt; no))<\/span><\/div><svg width=\"132\" height=\"30\" viewBox=\"0 0 132 30\" xmlns=\"http://www.w3.org/2000/svg\"><path d=\"M2,15 H26 M106,15 H130\" stroke=\"#9aa0a6\" stroke-width=\"3\" stroke-linecap=\"round\"/><rect x=\"24\" y=\"4\" width=\"84\" height=\"22\" rx=\"11\" fill=\"#d9c28e\" stroke=\"#8a7440\"/><rect x=\"44\" y=\"4\" width=\"7\" height=\"22\" fill=\"#d62d20\" stroke=\"#0003\" stroke-width=\".6\"/><rect x=\"58\" y=\"4\" width=\"7\" height=\"22\" fill=\"#d62d20\" stroke=\"#0003\" stroke-width=\".6\"/><rect x=\"72\" y=\"4\" width=\"7\" height=\"22\" fill=\"#d62d20\" stroke=\"#0003\" stroke-width=\".6\"/><rect x=\"92\" y=\"4\" width=\"7\" height=\"22\" fill=\"#d4af37\" stroke=\"#0003\" stroke-width=\".6\"/><\/svg><div class=\"m\">vermelho–vermelho–vermelho–dourado<\/div><div class=\"m\">Pernas nos furos <span class=\"hole\">32H<\/span> e <span class=\"hole\">36H<\/span><\/div><\/div><div class=\"card\" style=\"border-left-color:#8a7440\"><div class=\"t\">R2 · 3,3 kΩ <span class=\"m\">(R2 divisor (no -&gt; GND))<\/span><\/div><svg width=\"132\" height=\"30\" viewBox=\"0 0 132 30\" xmlns=\"http://www.w3.org/2000/svg\"><path d=\"M2,15 H26 M106,15 H130\" stroke=\"#9aa0a6\" stroke-width=\"3\" stroke-linecap=\"round\"/><rect x=\"24\" y=\"4\" width=\"84\" height=\"22\" rx=\"11\" fill=\"#d9c28e\" stroke=\"#8a7440\"/><rect x=\"44\" y=\"4\" width=\"7\" height=\"22\" fill=\"#f08a1c\" stroke=\"#0003\" stroke-width=\".6\"/><rect x=\"58\" y=\"4\" width=\"7\" height=\"22\" fill=\"#f08a1c\" stroke=\"#0003\" stroke-width=\".6\"/><rect x=\"72\" y=\"4\" width=\"7\" height=\"22\" fill=\"#d62d20\" stroke=\"#0003\" stroke-width=\".6\"/><rect x=\"92\" y=\"4\" width=\"7\" height=\"22\" fill=\"#d4af37\" stroke=\"#0003\" stroke-width=\".6\"/><\/svg><div class=\"m\">laranja–laranja–vermelho–dourado<\/div><div class=\"m\">Pernas nos furos <span class=\"hole\">36G<\/span> e <span class=\"hole\">33G<\/span><\/div><\/div><div class=\"sec\">Como<\/div><div class=\"how\">R1 nos furos 32H e 36H. R2 nos furos 36G e 33G. A coluna 36 é o NÓ do divisor.<\/div>", "title": ""}, {"kind": "step", "stage": "B", "focus": [100.0, 311.2, 780.0, 487.5], "ghost": [], "html": "<div class=\"kicker\">Estágio B · HC-SR04 + divisor de ECHO · passo 4 de 11<\/div><h1>Ligue 5 V e GND<\/h1><div class=\"sec\">Adicione agora<\/div><div class=\"card\" style=\"border-left-color:#e0312f\"><div class=\"t\"><span class=\"swatch\" style=\"background:#e0312f\"><\/span>Fio W1 · vermelho<\/div><div class=\"m\">5V -&gt; VCC do HC-SR04<\/div><div>Ponta 1: <span class=\"hole\">22A<\/span> <span class=\"m\">coluna do pino 5V da ESP32<\/span><\/div><div>Ponta 2: <span class=\"hole\">30H<\/span> <span class=\"m\">coluna 30: onde ficará o pino VCC do HC-SR04 (entra depois)<\/span><\/div><div class=\"m\" style=\"color:var(--bad)\">⚠ Somente HC-SR04 e LCD usam 5 V. NUNCA levar este fio ao TCRT5000 ou ao potenciometro.<\/div><\/div><div class=\"card\" style=\"border-left-color:#2b2b2b\"><div class=\"t\"><span class=\"swatch\" style=\"background:#2b2b2b\"><\/span>Fio W2 · preto<\/div><div class=\"m\">GND -&gt; GND do HC-SR04<\/div><div>Ponta 1: <span class=\"hole\">10J<\/span> <span class=\"m\">coluna do pino GND da ESP32<\/span><\/div><div>Ponta 2: <span class=\"hole\">33I<\/span> <span class=\"m\">coluna da perna de R2<\/span><\/div><div class=\"m\" style=\"color:var(--bad)\">⚠ Sem terra comum o ECHO flutua e pode injetar 5 V no GPIO.<\/div><\/div><div class=\"sec\">Como<\/div><div class=\"how\">Fio vermelho: 22A → 30H (pino 5V da ESP32 até a coluna do VCC). Fio preto: 10J → 33I (GND da ESP32 até a coluna do GND).<\/div>", "title": ""}, {"kind": "step", "stage": "B", "focus": [424.0, 284.2, 780.0, 487.5], "ghost": [], "html": "<div class=\"kicker\">Estágio B · HC-SR04 + divisor de ECHO · passo 5 de 11<\/div><h1>PARE: ensaio do divisor<\/h1><div class=\"hold\">PONTO DE PARADA — não avance sem conferir<\/div><div class=\"sec\">Adicione agora<\/div><div class=\"card\" style=\"border-left-color:#9a9a9a\"><div class=\"t\"><span class=\"swatch\" style=\"background:#9a9a9a\"><\/span>jumper TEMPORÁRIO · cinza<\/div><div class=\"m\">jumper TEMPORARIO do ensaio (nao faz parte do circuito final)<\/div><div>Ponta 1: <span class=\"hole\">30G<\/span> <span class=\"m\">coluna 30: onde ficará o pino VCC do HC-SR04 (entra depois)<\/span><\/div><div>Ponta 2: <span class=\"hole\">32G<\/span> <span class=\"m\">coluna da perna de R1<\/span><\/div><\/div><div class=\"sec\">Como<\/div><div class=\"how\">Sem o HC-SR04 e sem o fio verde. O jumper temporário (tracejado) leva 5 V à ponta de R1. Conecte a USB e meça entre o furo 36F e o GND: esperado ≈ 3,0 V.<\/div><div class=\"warn\">⚠ Mais de 3,30 V: desconecte a USB AGORA e refaça o divisor.<\/div>", "title": ""}, {"kind": "step", "stage": "B", "focus": [340.0, 256.2, 780.0, 487.5], "ghost": [], "html": "<div class=\"kicker\">Estágio B · HC-SR04 + divisor de ECHO · passo 6 de 11<\/div><h1>Registre a medição e tire o jumper<\/h1><div class=\"sec\">Como<\/div><div class=\"how\">Desconecte a USB e retire o jumper temporário T1.<\/div><pre>python -m terminal.bench divider --r1 2200 --r2 3300 --measured-v &lt;valor medido&gt;<button data-copy=\"python -m terminal.bench divider --r1 2200 --r2 3300 --measured-v &lt;valor medido&gt;\">copiar<\/button><\/pre>", "title": ""}, {"kind": "step", "stage": "B", "focus": [290.0, 93.5, 780.0, 487.5], "ghost": [], "html": "<div class=\"kicker\">Estágio B · HC-SR04 + divisor de ECHO · passo 7 de 11<\/div><h1>Encaixe o HC-SR04<\/h1><div class=\"sec\">Adicione agora<\/div><div class=\"card\"><div class=\"t\">M1 · HC-SR04<\/div><div class=\"m\">Encaixe os pinos nestes furos:<\/div><table class=\"p\"><tr><th>Pino<\/th><th>Furo<\/th><\/tr><tr><td><b>VCC<\/b><\/td><td><span class=\"hole\">30J<\/span><\/td><\/tr><tr><td><b>TRIG<\/b><\/td><td><span class=\"hole\">31J<\/span><\/td><\/tr><tr><td><b>ECHO<\/b><\/td><td><span class=\"hole\">32J<\/span><\/td><\/tr><tr><td><b>GND<\/b><\/td><td><span class=\"hole\">33J<\/span><\/td><\/tr><\/table><\/div><div class=\"sec\">Como<\/div><div class=\"how\">Leia a serigrafia do módulo: VCC na coluna 30, depois TRIG, ECHO e GND (coluna 33). Empurre os 4 pinos retos juntos.<\/div><div class=\"warn\">⚠ VCC e GND trocados podem queimar o módulo.<\/div>", "title": ""}, {"kind": "step", "stage": "B", "focus": [100.0, 208.2, 780.0, 487.5], "ghost": [], "html": "<div class=\"kicker\">Estágio B · HC-SR04 + divisor de ECHO · passo 8 de 11<\/div><h1>Fio do TRIG<\/h1><div class=\"sec\">Adicione agora<\/div><div class=\"card\" style=\"border-left-color:#f2c30f\"><div class=\"t\"><span class=\"swatch\" style=\"background:#f2c30f\"><\/span>Fio W3 · amarelo<\/div><div class=\"m\">GPIO5 -&gt; TRIG<\/div><div>Ponta 1: <span class=\"hole\">13J<\/span> <span class=\"m\">coluna do pino IO5 da ESP32<\/span><\/div><div>Ponta 2: <span class=\"hole\">31I<\/span> <span class=\"m\">coluna do pino TRIG do HC-SR04<\/span><\/div><div class=\"m\" style=\"color:var(--bad)\">⚠ GPIO5 e pino de strapping; usa-lo como saida e aceitavel.<\/div><\/div><div class=\"sec\">Como<\/div><div class=\"how\">Fio amarelo: 13J → 31I (GPIO5 → TRIG).<\/div>", "title": ""}, {"kind": "step", "stage": "B", "focus": [290.0, 133.5, 780.0, 487.5], "ghost": [], "html": "<div class=\"kicker\">Estágio B · HC-SR04 + divisor de ECHO · passo 9 de 11<\/div><h1>Inspecione antes de  class=\"hole\">28B<\/span> <span class=\"m\">coluna do pino GND do TCRT5000<\/span><\/div><\/div><div class=\"sec\">Como<\/div><div class=\"how\">Módulo em 27A–30A na ordem VCC, GND, DO, AO (CONFIRA a serigrafia). Laranja: 4A → 27B (3V3 → VCC). Preto: 17A → 28B (GND).<\/div><div class=\"warn\">⚠ NUNCA ligue o TCRT5000 em 5 V.<\/div>", "title": ""}, {"kind": "step", "stage": "C", "focus": [305.5, 503.2, 780.0, 487.5], "ghost": [], "html": "<div class=\"kicker\">Estágio C · TCRT5000 + potenciometro · passo 3 de 5<\/div><h1>Potenciômetro<\/h1><div class=\"sec\">Adicione agora<\/div><div class=\"card\"><div class=\"t\">P1 · Potenciometro rotativo<\/div><div class=\"m\">Encaixe os pinos nestes furos:<\/div><table class=\"p\"><tr><th>Pino<\/th><th>Furo<\/th><\/tr><tr><td><b>END_A<\/b><\/td><td><span class=\"hole\">34A<\/span><\/td><\/tr><tr><td><b>WIPER<\/b><\/td><td><span class=\"hole\">35A<\/span><\/td><\/tr><tr><td><b>END_B<\/b><\/td><td><span class=\"hole\">36A<\/span><\/td><\/tr><\/table><\/div><div class=\"card\" style=\"border-left-color:#f08a1c\"><div class=\"t\"><span class=\"swatch\" style=\"background:#f08a1c\"><\/span>Fio W6 · laranja<\/div><div class=\"m\">3V3 -&gt; extremo do potenciometro<\/div><div>Ponta 1: <span class=\"hole\">27C<\/span> <span class=\"m\">coluna do pino VCC do TCRT5000<\/span><\/div><div>Ponta 2: <span class=\"hole\">34C<\/span> <span class=\"m\">coluna do pino END_A do potenciômetro<\/span><\/div><div class=\"m\" style=\"color:var(--bad)\">⚠ NUNCA ligar o potenciometro em 5 V.<\/div><\/div><div class=\"card\" style=\"border-left-color:#2b2b2b\"><div class=\"t\"><span class=\"swatch\" style=\"background:#2b2b2b\"><\/span>Fio W8 · preto<\/div><div class=\"m\">GND -&gt; extremo do potenciometro<\/div><div>Ponta 1: <span class=\"hole\">28C<\/span> <span class=\"m\">coluna do pino GND do TCRT5000<\/span><\/div><div>Ponta 2: <span class=\"hole\">36C<\/span> <span class=\"m\">coluna do pino END_B do potenciômetro<\/span><\/div><\/div><div class=\"sec\">Como<\/div><div class=\"how\">Pinos em 34A, 35A e 36A (cursor no meio). Laranja: 27C → 34C (3,3 V). Preto: 28C → 36C (GND).<\/div><div class=\"warn\">⚠ NUNCA ligue o potenciômetro em 5 V.<\/div>", "title": ""}, {"kind": "step", "stage": "C", "focus": [70.0, 438.2, 780.0, 487.5], "ghost": [], "html": "<div class=\"kicker\">Estágio C · TCRT5000 + potenciometro · passo 4 de 5<\/div><h1>Sinais<\/h1><div class=\"sec\">Adicione agora<\/div><div class=\"card\" style=\"border-left-color:#2f6fe0\"><div class=\"t\"><span class=\"swatch\" style=\"background:#2f6fe0\"><\/span>Fio W9 · azul<\/div><div class=\"m\">DO -&gt; GPIO35<\/div><div>Ponta 1: <span class=\"hole\">29B<\/span> <span class=\"m\">coluna do pino DO do TCRT5000<\/span><\/div><div>Ponta 2: <span class=\"hole\">9A<\/span> <span class=\"m\">coluna do pino IO35 da ESP32<\/span><\/div><\/div><div class=\"card\" style=\"border-left-color:#8a47c9\"><div class=\"t\"><span class=\"swatch\" style=\"background:#8a47c9\"><\/span>Fio W10 · roxo<\/div><div class=\"m\">Cursor -&gt; GPIO36 (VP)<\/div><div>Ponta 1: <span class=\"hole\">35B<\/span> <span class=\"m\">coluna do pino WIPER do potenciômetro<\/span><\/div><div>Ponta 2: <span class=\"hole\">6A<\/span> <span class=\"m\">coluna do pino VP da ESP32<\/span><\/div><\/div><div class=\"sec\">Como<\/div><div class=\"how\">Azul: 29B → 9A (DO → IO35). Roxo: 35B → 6A (cursor → VP / GPIO36).<\/div>", "title": ""}, {"kind": "step", "stage": "C", "focus": [300.9, 560.5, 780.0, 487.5], "ghost": [], "html": "<div class=\"kicker\">Estágio C · TCRT5000 + potenciometro · passo 5 de 5<\/div><h1>Ligue e valide<\/h1><div class=\"sec\">Como<\/div><div class=\"how\">Conecte a USB e rode os comandos. Aproxime o dedo do TCRT5000 e gire o potenciômetro.<\/div><pre>python -m terminal.bench stage C --serial-port COMx<button data-copy=\"python -m terminal.bench stage C --serial-port COMx\">copiar<\/button><\/pre><pre>python -m terminal.diag --serial-port COMx<button data-copy=\"python -m terminal.diag --serial-port COMx\">copiar<\/button><\/pre>", "title": ""}, {"kind": "step", "stage": "D", "focus": [0.0, 316.2, 780.0, 487.5], "ghost": [], "html": "<div class=\"kicker\">Estágio D · LCD 2004A · passo 1 de 9<\/div><h1>Desligue tudo<\/h1><div class=\"sec\">Como<\/div><div class=\"how\">Desconecte a USB antes de mexer.<\/div>", "title": ""}, {"kind": "step", "stage": "D", "focus": [720.2, 10.1, 799.7, 499.8], "ghost": ["M3"], "html": "<div class=\"kicker\">Estágio D · LCD 2004A · passo 2 de 9<\/div><h1>Confira o LCD<\/h1><div class=\"sec\">Como<\/div><div class=\"how\">Olhe o módulo antes de encaixar. Anote o que achar (confirmações C07 e C08).<\/div><ul class=\"checks\"><li>Header de 16 pinos soldado?<\/li><li>Existe o resistor SMD R8/R9 do backlight? (se não, o R4 é obrigatório)<\/li><li>Controlador HD44780 genuíno ou clone?<\/li><\/ul>", "title": ""}, {"kind": "step", "stage": "D", "focus": [720.2, 10.1, 799.7, 499.8], "ghost": [], "html": "<div class=\"kicker\">Estágio D · LCD 2004A · passo 3 de 9<\/div><h1>Encaixe o LCD<\/h1><div class=\"sec\">Adicione agora<\/div><div class=\"card\"><div class=\"t\">M3 · LCD 2004A V1.1<\/div><div class=\"m\">Encaixe os pinos nestes furos:<\/div><table class=\"p\"><tr><th>Pino<\/th><th>Furo<\/th><\/tr><tr><td><b>VSS<\/b><\/td><td><span class=\"hole\">46J<\/span><\/td><\/tr><tr><td><b>VDD<\/b><\/td><td><span class=\"hole\">47J<\/span><\/td><\/tr><tr><td><b>V0<\/b><\/td><td><span class=\"hole\">48J<\/span><\/td><\/tr><tr><td><b>RS<\/b><\/td><td><span class=\"hole\">49J<\/span><\/td><\/tr><tr><td><b>RW<\/b><\/td><td><span class=\"hole\">50J<\/span><\/td><\/tr><tr><td><b>E<\/b><\/td><td><span class=\"hole\">51J<\/span><\/td><\/tr><tr><td><b>D4<\/b><\/td><td><span class=\"hole\">56J<\/span><\/td><\/tr><tr><td><b>D5<\/b><\/td><td><span class=\"hole\">57J<\/span><\/td><\/tr><tr><td><b>D6<\/b><\/td><td><span class=\"hole\">58J<\/span><\/td><\/tr><tr><td><b>D7<\/b><\/td><td><span class=\"hole\">59J<\/span><\/td><\/tr><tr><td><b>A<\/b><\/td><td><span class=\"hole\">60J<\/span><\/td><\/tr><tr><td><b>K<\/b><\/td><td><span class=\"hole\">61J<\/span><\/td><\/tr><\/table><div class=\"m\">D0–D3: encaixam mas ficam sem fio.<\/div><\/div><div class=\"sec\">Como<\/div><div class=\"how\">Pino 1 (VSS) em 46J … pino 16 (K) em 61J.<\/div>", "title": ""}, {"kind": "step", "stage": "D", "focus": [600.0, 256.2, 780.0, 487.5], "ghost": [], "html": "<div class=\"kicker\">Estágio D · LCD 2004A · passo 4 de 9<\/div><h1>Terra, inclusive o RW<\/h1><div class=\"hold\">PONTO DE PARADA — não avance sem conferir<\/div><div class=\"sec\">Adicione agora<\/div><div class=\"card\" style=\"border-left-color:#2b2b2b\"><div class=\"t\"><span class=\"swatch\" style=\"background:#2b2b2b\"><\/span>Fio W12 · preto<\/div><div class=\"m\">GND -&gt; no de terra do LCD<\/div><div>Ponta 1: <span class=\"hole\">33H<\/span> <span class=\"m\">coluna do pino GND do HC-SR04 e da perna de R2<\/span><\/div><div>Ponta 2: <span class=\"hole\">44I<\/span> <span class=\"m\">coluna 44: onde ficará o pino da perna de R3 (entra depois)<\/span><\/div><\/div><div class=\"card\" style=\"border-left-color:#2b2b2b\"><div class=\"t\"><span class=\"swatch\" style=\"background:#2b2b2b\"><\/span>Fio W13 · preto<\/div><div class=\"m\">GND -&gt; VSS (pino 1)<\/div><div>Ponta 1: <span class=\"hole\">44H<\/span> <span class=\"m\">coluna 44: onde ficará o pino da perna de R3 (entra depois)<\/span><\/div><div>Ponta 2: <span class=\"hole\">46H<\/span> <span class=\"m\">coluna do pino VSS do LCD<\/span><\/div><\/div><div class=\"card\" style=\"border-left-color:#2b2b2b\"><div class=\"t\"><span class=\"swatch\" style=\"background:#2b2b2b\"><\/span>Fio W14 · preto<\/div><div class=\"m\">GND -&gt; RW (pino 5)<\/div><div>Ponta 1: <span class=\"hole\">44F<\/span> <span class=\"m\">coluna 44: onde ficará o pino da perna de R3 (entra depois)<\/span><\/div><div>Ponta 2: <span class=\"hole\">50I<\/span> <span class=\"m\">coluna do pino RW do LCD<\/span><\/div><div class=\"m\" style=\"color:var(--bad)\">⚠ OBRIGATORIO: RW = 0,0 Ohm para GND antes de ligar.<\/div><\/div><div class=\"card\" style=\"border-left-color:#2b2b2b\"><div class=\"t\"><span class=\"swatch\" style=\"background:#2b2b2b\"><\/span>Fio W15 · preto<\/div><div class=\"m\">GND -&gt; K (pino 16)<\/div><div>Ponta 1: <span class=\"hole\">50H<\/span> <span class=\"m\">coluna do pino RW do LCD<\/span><\/div><div>Ponta 2: <span class=\"hole\">61I<\/span> <span class=\"m\">coluna do pino K do LCD<\/span><\/div><\/div><div class=\"sec\">Como<\/div><div class=\"how\">Pretos: 33H → 44I; 44H → 46H (VSS); 44F → 50I (RW); 50H → 61I (K). Meça RW↔GND: 0 Ω.<\/div><div class=\"warn\">⚠ O RW (pino 5) PRECISA estar no GND antes de ligar: protege os GPIOs de 5 V.<\/div>", "title": ""}, {"kind": "step", "stage": "D", "focus": [592.0, 250.2, 780.0, 487.5], "ghost": [], "html": "<div class=\"kicker\">Estágio D · LCD 2004A · passo 5 de 9<\/div><h1>Contraste, backlight e 5 V<\/h1><div class=\"sec\">Adicione agora<\/div><div class=\"card\" style=\"border-left-color:#8a7440\"><div class=\"t\">R3 · 1 kΩ <span class=\"m\">(R3 contraste V0 -&gt; GND)<\/span><\/div><svg width=\"132\" height=\"30\" viewBox=\"0 0 132 30\" xmlns=\"http://www.w3.org/2000/svg\"><path d=\"M2,15 H26 M106,15 H130\" stroke=\"#9aa0a6\" stroke-width=\"3\" stroke-linecap=\"round\"/><rect x=\"24\" y=\"4\" width=\"84\" height=\"22\" rx=\"11\" fill=\"#d9c28e\" stroke=\"#8a7440\"/><rect x=\"44\" y=\"4\" width=\"7\" height=\"22\" fill=\"#7a4a21\" stroke=\"#0003\" stroke-width=\".6\"/><rect x=\"58\" y=\"4\" width=\"7\" height=\"22\" fill=\"#111\" stroke=\"#0003\" stroke-width=\".6\"/><rect x=\"72\" y=\"4\" width=\"7\" height=\"22\" fill=\"#d62d20\" stroke=\"#0003\" stroke-width=\".6\"/><rect x=\"92\" y=\"4\" width=\"7\" height=\"22\" fill=\"#d4af37\" stroke=\"#0003\" stroke-width=\".6\"/><\/svg><div class=\"m\">marrom–preto–vermelho–dourado<\/div><div class=\"m\">Pernas nos furos <span class=\"hole\">48G<\/span> e <span class=\"hole\">44G<\/span><\/div><div class=\"m\">Conforme docs/hardware_safety.md (1,0-2,2 kOhm de V0 a GND). ATENCAO: um resistor sozinho de V0 a GND deixa V0 ~ 0 V (contraste maximo); 0,4-0,8 V exige um divisor 5 V/GND ou o potenciometro. Decidir na bancada (C07).<\/div><\/div><div class=\"card\" style=\"border-left-color:#8a7440\"><div class=\"t\">R4 · 150 Ω <span class=\"m\">(R4 backlight 5 V -&gt; A (condicional))<\/span><\/div><svg width=\"132\" height=\"30\" viewBox=\"0 0 132 30\" xmlns=\"http://www.w3.org/2000/svg\"><path d=\"M2,15 H26 M106,15 H130\" stroke=\"#9aa0a6\" stroke-width=\"3\" stroke-linecap=\"round\"/><rect x=\"24\" y=\"4\" width=\"84\" height=\"22\" rx=\"11\" fill=\"#d9c28e\" stroke=\"#8a7440\"/><rect x=\"44\" y=\"4\" width=\"7\" height=\"22\" fill=\"#7a4a21\" stroke=\"#0003\" stroke-width=\".6\"/><rect x=\"58\" y=\"4\" width=\"7\" height=\"22\" fill=\"#2fa84f\" stroke=\"#0003\" stroke-width=\".6\"/><rect x=\"72\" y=\"4\" width=\"7\" height=\"22\" fill=\"#7a4a21\" stroke=\"#0003\" stroke-width=\".6\"/><rect x=\"92\" y=\"4\" width=\"7\" height=\"22\" fill=\"#d4af37\" stroke=\"#0003\" stroke-width=\".6\"/><\/svg><div class=\"m\">marrom–verde–marrom–dourado<\/div><div class=\"m\">Pernas nos furos <span class=\"hole\">63G<\/span> e <span class=\"hole\">60G<\/span><\/div><div class=\"m\">Docs: 100-220 Ohm em serie se a placa nao tiver SMD R8/R9. Seguro mesmo que ja exista (apenas reduz o brilho).<\/div><\/div><div class=\"card\" style=\"border-left-color:#e0312f\"><div class=\"t\"><span class=\"swatch\" style=\"background:#e0312f\"><\/span>Fio W16 · vermelho<\/div><div class=\"m\">5V -&gt; VDD (pino 2)<\/div><div>Ponta 1: <span class=\"hole\">30G<\/span> <span class=\"m\">coluna do pino VCC do HC-SR04<\/span><\/div><div>Ponta 2: <span class=\"hole\">47I<\/span> <span class=\"m\">coluna do pino VDD do LCD<\/span><\/div><div class=\"m\" style=\"color:var(--bad)\">⚠ Se os caracteres vierem corrompidos, ver contingencia do diodo em docs/hardware_safety.md.<\/div><\/div><div class=\"card\" style=\"border-left-color:#e0312f\"><div class=\"t\"><span class=\"swatch\" style=\"background:#e0312f\"><\/span>Fio W17 · vermelho<\/div><div class=\"m\">5V -&gt; R4 (backlight)<\/div><div>Ponta 1: <span class=\"hole\">47H<\/span> <span class=\"m\">coluna do pino VDD do LCD<\/span><\/div><div>Ponta 2: <span class=\"hole\">63H<\/span> <span class=\"m\">coluna da perna de R4<\/span><\/div><\/div><div class=\"sec\">Como<\/div><div class=\"how\">R3 (1 kΩ): 48G e 44G. R4 (150 Ω): 63G e 60G. Vermelhos: 30G → 47I (VDD) e 47H → 63H.<\/div><div class=\"warn\">⚠ O contraste (V0) ainda está em aberto: veja a confirmação C07.<\/div>", "title": ""}, {"kind": "step", "stage": "D", "focus": [240.0, 133.2, 860.0, 537.5], "ghost": [], "html": "<div class=\"kicker\">Estágio D · LCD 2004A · passo 6 de 9<\/div><h1>Sinais do display (1/3): RS e E<\/h1><div class=\"sec\">Adicione agora<\/div><div class=\"card\" style=\"border-left-color:#2f6fe0\"><div class=\"t\"><span class=\"swatch\" style=\"background:#2f6fe0\"><\/span>Fio W18 · azul<\/div><div class=\"m\">GPIO19 -&gt; RS (pino 4)<\/div><div>Ponta 1: <span class=\"hole\">11J<\/span> <span class=\"m\">coluna do pino IO19 da ESP32<\/span><\/div><div>Ponta 2: <span class=\"hole\">49I<\/span> <span class=\"m\">coluna do pino RS do LCD<\/span><\/div><\/div><div class=\"card\" style=\"border-left-color:#2fa84f\"><div class=\"t\"><span class=\"swatch\" style=\"background:#2fa84f\"><\/span>Fio W19 · verde<\/div><div class=\"m\">GPIO18 -&gt; E (pino 6)<\/div><div>Ponta 1: <span class=\"hole\">12J<\/span> <span class=\"m\">coluna do pino IO18 da ESP32<\/span><\/div><div>Ponta 2: <span class=\"hole\">51I<\/span> <span class=\"m\">coluna do pino E do LCD<\/span><\/div><\/div><div class=\"sec\">Como<\/div><div class=\"how\">11J → 49I (GPIO19 → RS) e 12J → 51I (GPIO18 → E). Os fios de sinal são longos: deixe-os folgados.<\/div>", "title": ""}, {"kind": "step", "stage": "D", "focus": [140.0, 50.5, 1080.0, 675.0], "ghost": [], "html": "<div class=\"kicker\">Estágio D · LCD 2004A · passo 7 de 9<\/div><h1>Sinais do display (2/3): D4 e D5<\/h1><div class=\"sec\">Adicione agora<\/div><div class=\"card\" style=\"border-left-color:#f4f4f4\"><div class=\"t\"><span class=\"swatch\" style=\"background:#f4f4f4\"><\/span>Fio W20 · branco<\/div><div class=\"m\">GPIO21 -&gt; D4 (pino 11)<\/div><div>Ponta 1: <span class=\"hole\">9J<\/span> <span class=\"m\">coluna do pino IO21 da ESP32<\/span><\/div><div>Ponta 2: <span class=\"hole\">56I<\/span> <span class=\"m\">coluna do pino D4 do LCD<\/span><\/div><\/div><div class=\"card\" style=\"border-left-color:#8a5a2b\"><div class=\"t\"><span class=\"swatch\" style=\"background:#8a5a2b\"><\/span>Fio W21 · marrom<\/div><div class=\"m\">GPIO22 -&gt; D5 (pino 12)<\/div><div>Ponta 1: <span class=\"hole\">6J<\/span> <span class=\"m\">coluna do pino IO22 da ESP32<\/span><\/div><div>Ponta 2: <span class=\"hole\">57I<\/span> <span class=\"m\">coluna do pino D5 do LCD<\/span><\/div><\/div><div class=\"sec\">Como<\/div><div class=\"how\">9J → 56I (GPIO21 → D4) e 6J → 57I (GPIO22 → D5).<\/div>", "title": ""}, {"kind": "step", "stage": "D", "focus": [120.0, 106.0, 1280.0, 800.0], "ghost": [], "html": "<div class=\"kicker\">Estágio D · LCD 2004A · passo 8 de 9<\/div><h1>Sinais do display (3/3): D6 e D7<\/h1><div class=\"sec\">Adicione agora<\/div><div class=\"card\" style=\"border-left-color:#f08a1c\"><div class=\"t\"><span class=\"swatch\" style=\"background:#f08a1c\"><\/span>Fio W22 · laranja<\/div><div class=\"m\">GPIO23 -&gt; D6 (pino 13)<\/div><div>Ponta 1: <span class=\"hole\">5J<\/span> <span class=\"m\">coluna do pino IO23 da ESP32<\/span><\/div><div>Ponta 2: <span class=\"hole\">58I<\/span> <span class=\"m\">coluna do pino D6 do LCD<\/span><\/div><\/div><div class=\"card\" style=\"border-left-color:#8a47c9\"><div class=\"t\"><span class=\"swatch\" style=\"background:#8a47c9\"><\/span>Fio W23 · roxo<\/div><div class=\"m\">GPIO27 -&gt; D7 (pino 14)<\/div><div>Ponta 1: <span class=\"hole\">14A<\/span> <span class=\"m\">coluna do pino IO27 da ESP32<\/span><\/div><div>Ponta 2: <span class=\"hole\">59I<\/span> <span class=\"m\">coluna do pino D7 do LCD<\/span><\/div><\/div><div class=\"sec\">Como<\/div><div class=\"how\">5J → 58I (GPIO23 → D6) e 14A → 59I (GPIO27 → D7). O D7 vem da fileira de BAIXO da ESP32 (14A).<\/div>", "title": ""}, {"kind": "step", "stage": "D", "focus": [720.2, 10.1, 799.7, 499.8], "ghost": [], "html": "<div class=\"kicker\">Estágio D · LCD 2004A · passo 9 de 9<\/div><h1>Ligue e valide<\/h1><div class=\"sec\">Como<\/div><div class=\"how\">Conecte a USB e rode o comando. Ajuste o contraste se o display estiver só com blocos.<\/div><pre>python -m terminal.bench stage D --serial-port COMx<button data-copy=\"python -m terminal.bench stage D --serial-port COMx\">copiar<\/button><\/pre>", "title": ""}, {"kind": "step", "stage": "E", "focus": [53.0, 161.9, 1274.0, 796.2], "ghost": [], "html": "<div class=\"kicker\">Estágio E · Montagem completa · passo 1 de 2<\/div><h1>Revisão final<\/h1><div class=\"hold\">PONTO DE PARADA — não avance sem conferir<\/div><div class=\"sec\">Como<\/div><div class=\"how\">Com a USB desconectada, repita as medições 01–09 do guia de bancada.<\/div><ul class=\"checks\"><li>01 Sem curto 5V↔GND (&gt; 1 kΩ)<\/li><li>02 Sem curto 3V3↔GND (&gt; 500 Ω)<\/li><li>03/04 R1 = 2,09–2,31 kΩ e R2 = 3,14–3,47 kΩ<\/li><li>05 RW do LCD com 0 Ω até o GND<\/li><li>06/07 TCRT5000 e potenciômetro só em 3V3<\/li><li>08/09 Nada em IO6…IO12, TX0, RX0<\/li><\/ul>", "title": ""}, {"kind": "step", "stage": "E", "focus": [53.0, 161.9, 1274.0, 796.2], "ghost": [], "html": "<div class=\"kicker\">Estágio E · Montagem completa · passo 2 de 2<\/div><h1>Teste ponta a ponta<\/h1><div class=\"sec\">Como<\/div><div class=\"how\">Tudo montado: rode o teste completo.<\/div><pre>python -m terminal.bench e2e --serial-port COMx<button data-copy=\"python -m terminal.bench e2e --serial-port COMx\">copiar<\/button><\/pre>", "title": ""}, {"kind": "text", "stage": "", "html": "<div class=\"kicker\">Ajuda<\/div><h1>Se algo der errado<\/h1><ul class=\"cols2\"><li>ESP32 deslocada uma coluna: TODOS os pinos ficam errados. Confira: 3V3 na coluna 4 e 5V na coluna 22 (fileira de baixo).<\/li><li>Letras da protoboard invertidas (A no topo em vez de J): guie-se pelo NÚMERO da coluna; se as letras estiverem ao contrário, gire a protoboard.<\/li><li>HC-SR04 com VCC e GND trocados: pode queimar o módulo. Leia a serigrafia (VCC | TRIG | ECHO | GND) antes de encaixar.<\/li><li>ECHO ligado direto ao GPIO34 (sem divisor): proibido; entrega ~5 V a um pino de 3,3 V.<\/li><li>R1 e R2 trocados: o nó cai para 2,0 V (abaixo de 2,475 V) e a leitura falha (sem dano, mas sem distância).<\/li><li>TCRT5000 ou potenciômetro ligados em 5 V: só podem usar 3V3.<\/li><li>Fio em IO12, IO6…IO11 (SD0…CLK) ou TX0/RX0: proibido (boot loop, falha de flash ou serial).<\/li><li>LCD com RW (pino 5) no ar: obrigatório ligar ao GND antes de energizar.<\/li><li>Cabo USB só de carga (sem dados): a porta COM nunca aparece.<\/li><li>Jumper &#x27;quase&#x27; encaixado: empurre até o fim e puxe de leve para testar.<\/li><\/ul>", "title": "Se algo der errado"}, {"kind": "text", "stage": "", "html": "<div class=\"kicker\">Ajuda<\/div><h1>A ESP32 não aparece como porta COM<\/h1><ol class=\"how\"><li>Troque o cabo por um cabo USB DE DADOS e teste outra porta USB do notebook.<\/li><li>Deixe SOMENTE a ESP32 na protoboard (Estágio A): sem sensores nem fios.<\/li><li>Windows: Gerenciador de Dispositivos &gt; Portas (COM e LPT). Sem porta? Instale o driver da ponte USB-serial da placa (CP210x ou CH340).<\/li><li>Rode <code>python -m terminal.bench ports<\/code> para listar as portas.<\/li><li>Não use a ESP32 se 5V/3V3 medirem fora de 4,75–5,25 V / 3,25–3,35 V.<\/li><li>Para gravar o firmware pode ser preciso segurar BOOT ao iniciar o upload.<\/li><\/ol>", "title": "A ESP32 não aparece como porta COM"}];window.FULLBOX=[0, 0, 1555.8, 1048.0];
const SL=window.SLIDES,svg=document.querySelector('#figbox svg'),main=document.querySelector('main');
let k=0,showAll=false,vb=null,raf=0;const FULL=window.FULLBOX;
const $=(s)=>document.querySelector(s);
function setVB(t,animate){if(!vb||!animate){vb=t.slice();svg.setAttribute('viewBox',vb.join(' '));return}
 const from=vb.slice(),t0=performance.now(),D=380;cancelAnimationFrame(raf);
 (function step(now){const p=Math.min(1,(now-t0)/D),e=p<.5?2*p*p:1-Math.pow(-2*p+2,2)/2;
  vb=from.map((v,i)=>v+(t[i]-v)*e);svg.setAttribute('viewBox',vb.join(' '));if(p<1)raf=requestAnimationFrame(step)})(t0)}
function apply(animate){const s=SL[k];
 main.classList.toggle('textonly',s.kind!=='step');
 document.querySelectorAll('[data-gstep]').forEach(e=>{const g=+e.dataset.gstep,u=e.dataset.until;
  const gh=(s.ghost||[]).includes(e.dataset.ref||e.dataset.id);
  const vis=(g<=k&&(u===undefined||k<=+u))||gh;e.style.display=vis?'':'none';
  e.classList.toggle('now',vis&&g===k&&!gh);e.classList.toggle('old',vis&&g<k&&!gh);e.classList.toggle('ghost',gh)});
 if(s.kind==='step')setVB(showAll?FULL:s.focus,animate);
 $('#panel').innerHTML=s.html;$('#panel').scrollTop=0;
 document.querySelectorAll('.chip').forEach(c=>c.classList.toggle('on',c.dataset.stage===s.stage));
 $('#bar').style.width=((k)/(SL.length-1)*100)+'%';$('#cnt').textContent=(k+1)+' / '+SL.length;
 $('#prev').disabled=k===0;$('#next').disabled=k===SL.length-1;
 try{localStorage.setItem('mp_slide',k)}catch(e){}history.replaceState(null,'','#'+(k+1))}
function go(i,animate=true){k=Math.max(0,Math.min(SL.length-1,i));apply(animate)}
document.addEventListener('keydown',e=>{if(e.target.tagName==='INPUT')return;
 if(['ArrowRight','PageDown',' ','Enter'].includes(e.key)){e.preventDefault();go(k+1)}
 else if(['ArrowLeft','PageUp','Backspace'].includes(e.key)){e.preventDefault();go(k-1)}
 else if(e.key==='Home')go(0);else if(e.key==='End')go(SL.length-1);
 else if(e.key==='a'||e.key==='A'){showAll=!showAll;apply(true)}
 else if(e.key==='f'||e.key==='F'){document.fullscreenElement?document.exitFullscreen():document.documentElement.requestFullscreen()}});
document.addEventListener('click',e=>{const b=e.target.closest('button[data-copy]');if(b){const t=b.dataset.copy;
 (navigator.clipboard?navigator.clipboard.writeText(t):Promise.reject()).catch(()=>{const ta=document.createElement('textarea');ta.value=t;document.body.appendChild(ta);ta.select();try{document.execCommand('copy')}catch(_){}ta.remove()});
 b.textContent='copiado';setTimeout(()=>b.textContent='copiar',1200)}});
let sx=null;document.addEventListener('touchstart',e=>{sx=e.touches[0].clientX},{passive:true});
document.addEventListener('touchend',e=>{if(sx===null)return;const d=e.changedTouches[0].clientX-sx;if(Math.abs(d)>70)go(k+(d<0?1:-1));sx=null});
let start=0;const h=parseInt((location.hash||'').slice(1));if(h>=1&&h<=SL.length)start=h-1;
else{try{start=Math.min(SL.length-1,parseInt(localStorage.getItem('mp_slide')||'0')||0)}catch(e){}}
go(start,false);
</script></body></html>
