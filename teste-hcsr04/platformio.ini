; PlatformIO Project Configuration File
;
;   Build options: build flags, source filter
;   Upload options: custom upload port, speed and extra flags
;   Library options: dependencies, extra library storages
;   Advanced options: extra scripting
;
; Please visit documentation for the other options and examples
; https://docs.platformio.org/page/projectconf.html

[platformio]
default_envs = esp32dev

[env:esp32dev]
platform = espressif32
board = esp32dev
framework = arduino

; Diagnostico: captura de borda de ECHO sem pulseIn + ADC do GPIO34 como voltimetro.
;   pio run -e diag -t upload --upload-port COM3
[env:diag]
platform = espressif32
board = esp32dev
framework = arduino
monitor_speed = 115200
build_src_filter = -<*> +<../diag/diag_hcsr04.cpp>

; Escuta continua do ECHO (inclui disparo manual do TRIG a 5 V).
[env:diag2]
platform = espressif32
board = esp32dev
framework = arduino
monitor_speed = 115200
build_src_filter = -<*> +<../diag/diag2_escuta.cpp>

; Teste minimo isolado do HC-SR04 (TRIG=GPIO5, ECHO=GPIO34, leitura a cada 500 ms, timeout 30 ms).
;   pio run -e minimo -t upload --upload-port COM3
[env:minimo]
platform = espressif32
board = esp32dev
framework = arduino
monitor_speed = 115200
build_src_filter = -<*> +<../minimo/hcsr04_minimo.cpp>
